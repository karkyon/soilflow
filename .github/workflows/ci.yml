name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: soilflow_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soilflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soilflow/pdf build
      - run: pnpm typecheck
      - run: pnpm --filter @soilflow/billing test
      - run: pnpm --filter api test
      - run: pnpm --filter api build
      - run: pnpm --filter web gen:api && git diff --exit-code apps/web/lib/api/schema.d.ts
      - run: pnpm --filter web build
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: soilflow_e2e }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soilflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soilflow/pdf build
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test
      - name: OWASP ZAP のベースライン検査（ST-01：重大・高の指摘がないこと）
        run: |
          cd e2e
          PORT=4100 NODE_ENV=development ADAPTERS=fake DATABASE_URL=$E2E_DATABASE_URL STORAGE_DIR=/tmp/zap-files PUBLIC_BASE_URL=http://localhost:3100 SESSION_SECRET=zap node ../apps/api/dist/src/main.js > /tmp/api.log 2>&1 &
          API_ORIGIN=http://localhost:4100 WEB_PORT=3100 node serve.mjs > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3100/api/v1/healthz >/dev/null && break; sleep 1; done
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3100/login/ -J zap.json -r zap.html -I
          node -e "const r=require('./zap/zap.json');const hi=r.site.flatMap(s=>s.alerts).filter(a=>Number(a.riskcode)>=3);for(const a of r.site.flatMap(s=>s.alerts))console.log(a.riskdesc,'|',a.name);if(hi.length){console.error('重大・高:',hi.map(a=>a.name).join(', '));process.exit(1)}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: "e2e/playwright-report\ne2e/test-results\ne2e/zap", retention-days: 7 }
  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.4 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 秘密の情報が入っていないか（ST-10 gitleaks）
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: 依存の脆弱性（ST-10 pnpm audit、重大・高）
        run: pnpm audit --audit-level high
