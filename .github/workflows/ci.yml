name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: soilflow_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soilflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soilflow/pdf build
      - run: pnpm typecheck
      - run: pnpm --filter @soilflow/billing test
      - run: pnpm --filter api test
      - run: pnpm --filter api build
      - run: pnpm --filter web gen:api && git diff --exit-code apps/web/lib/api/schema.d.ts
      - run: pnpm --filter web build
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: soilflow_e2e }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soilflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soilflow/pdf build
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: "e2e/playwright-report\ne2e/test-results", retention-days: 7 }
