<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoilFlow 試作画面 1.0（freee会計連携あり）</title>
<style>
:root{
  color-scheme: light;
  --mk-bg:#e4e1d8; --mk-bar:#ffffff; --mk-ink:#16213c; --mk-muted:#5b6170; --mk-line:#cfc9bb; --mk-accent:#b8862e; --mk-chip:#f4f1e8;
  --navy:#16213c; --navy2:#22305a; --gold:#b8862e; --goldt:#f3e9d2; --goldd:#96701f; --cream:#f7f5ef; --ink:#1d2433; --muted:#5f6675; --line:#dcd6c8; --line2:#c9c2b2;
  --green:#1f6f4a; --okbg:#e2f3ea; --amber:#8f5900; --warnbg:#fff3cf; --red:#b23a3a; --ngbg:#fbe5e5; --blue:#245c96; --infobg:#e8f0fa; --teal:#2c6e63; --tealt:#dcebe7; --mud:#8a5a3c; --mudt:#f1e4d9; --kusa:#2c6e3f; --kusat:#e1efe4;
  --card:#ffffff; --shadow:0 2px 10px #16213c14;
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--mk-bg); color:var(--mk-ink); font:14px/1.55 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid #f2b705; outline-offset:2px; }
.skip{ position:absolute; left:-999px; } .skip:focus{ left:8px; top:8px; z-index:99; background:#fff; padding:8px 12px; }
.num{ font-variant-numeric:tabular-nums; }

/* ---------- 試作の外枠 ---------- */
.mk-bar{ position:sticky; top:0; z-index:50; background:var(--mk-bar); border-bottom:1px solid var(--mk-line); display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:8px 14px; }
.mk-title{ display:flex; flex-direction:column; margin-right:auto; min-width:260px; }
.mk-title b{ font-size:15px; } .mk-title span{ font-size:11.5px; color:var(--mk-muted); }
.mk-group{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mk-muted); }
.mk-group select,.mk-group input{ font-size:13px; padding:4px 8px; border:1px solid var(--mk-line); border-radius:7px; background:var(--mk-chip); min-height:32px; }
.mk-btn{ border:1px solid var(--mk-line); background:var(--mk-chip); color:var(--mk-ink); border-radius:7px; padding:5px 10px; min-height:32px; font-size:12.5px; text-decoration:none; display:inline-flex; align-items:center; }
.mk-btn[aria-pressed="true"]{ background:var(--mk-accent); border-color:var(--mk-accent); color:#fff; }
.mk-layout{ display:grid; grid-template-columns:250px minmax(0,1fr); gap:14px; padding:14px; align-items:start; }
.mk-side{ position:sticky; top:62px; max-height:calc(100vh - 80px); overflow:auto; background:var(--mk-bar); border:1px solid var(--mk-line); border-radius:12px; padding:12px; font-size:13px; }
.mk-side h2{ font-size:12.5px; margin:12px 0 6px; color:var(--mk-muted); }
.mk-side ol,.mk-side ul{ margin:0; padding:0; list-style:none; }
.mk-side li button{ width:100%; text-align:left; border:0; background:transparent; padding:6px 8px; border-radius:7px; display:flex; gap:8px; align-items:baseline; }
.mk-side li button:hover{ background:var(--mk-chip); }
.mk-side li button[aria-current="page"]{ background:var(--goldt); font-weight:700; }
.mk-side li button:disabled{ opacity:.45; cursor:not-allowed; }
.mk-side li button small{ color:var(--mk-muted); font-size:11px; min-width:50px; }
.mk-side .nv{ display:flex; gap:8px; padding:4px 8px; } .mk-side .nv small{ color:var(--mk-muted); font-size:11px; min-width:50px; }
.mk-side p{ margin:6px 0; color:var(--mk-muted); font-size:12px; }
.mk-stage{ display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:14px; align-items:start; }
.mk-stage.nomemo{ grid-template-columns:minmax(0,1fr); }
.mk-memo{ background:var(--mk-bar); border:1px solid var(--mk-line); border-left:4px solid var(--mk-accent); border-radius:12px; padding:12px 14px; font-size:12.5px; position:sticky; top:62px; max-height:calc(100vh - 80px); overflow:auto; }
.mk-memo h3{ margin:0 0 6px; font-size:13px; } .mk-memo ul{ margin:0; padding-left:18px; } .mk-memo li{ margin:5px 0; }
.mk-memo .ref{ color:var(--mk-muted); font-size:11.5px; margin-top:8px; }
.mk-memo .demo-ctl{ margin-top:10px; padding-top:8px; border-top:1px dashed var(--mk-line); }
.st{ display:inline-block; font-size:10.5px; font-weight:800; border-radius:4px; padding:0 6px; margin-right:3px; vertical-align:1px; white-space:nowrap; }
.st.ok{ background:var(--okbg); color:var(--green); } .st.plan{ background:var(--infobg); color:var(--blue); } .st.wait{ background:var(--warnbg); color:var(--amber); } .st.demo{ background:#ece9f7; color:#5a3e9b; } .st.real{ background:var(--goldt); color:var(--goldd); }
.devs{ display:flex; gap:14px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
.dev{ background:#11161f; border-radius:10px; padding:8px 8px 14px; box-shadow:0 10px 30px #0004; }
.dev.pc{ flex:1 1 900px; max-width:1500px; min-width:0; }
.dev.tab{ border-radius:26px; padding:16px; width:560px; flex:0 0 auto; }
.dev .screen{ background:var(--cream); color:var(--ink); border-radius:4px; overflow:hidden; min-height:720px; position:relative; }
.dev.tab .screen{ border-radius:14px; min-height:760px; }
.devcap{ text-align:center; color:var(--mk-muted); font-size:11.5px; margin-top:6px; }

/* ---------- 本番画面の部品 ---------- */
.appbar{ height:52px; background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px; padding:0 16px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.04em; white-space:nowrap; }
.brand i{ width:30px; height:30px; border-radius:8px; background:linear-gradient(145deg,#d6a64a,#9a6c1d); display:grid; place-items:center; font-style:normal; font-weight:900; color:#fff; }
.brand small{ font-weight:500; font-size:12px; color:#c9cfdc; letter-spacing:0; }
.appbar nav{ display:flex; gap:4px; margin-left:12px; }
.appbar nav button{ background:transparent; border:0; color:#d6dbe7; padding:7px 12px; border-radius:7px; font-size:13.5px; }
.appbar nav button[aria-current="page"]{ background:#ffffff1f; color:#fff; font-weight:700; }
.appbar .sp{ flex:1; }
.appbar .who{ font-size:12.5px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.appbar .who em{ font-style:normal; font-size:11px; background:#ffffff26; border-radius:999px; padding:1px 8px; }
.appbar .net{ font-size:11.5px; color:#9fe3bf; } .appbar .net.off{ color:#ffb3b3; }
.appbar .ab{ border:1px solid #ffffff55; background:transparent; color:#fff; border-radius:8px; padding:5px 10px; font-size:12.5px; }
.offwrap{ display:grid; grid-template-columns:200px minmax(0,1fr); min-height:668px; }
.offnav{ background:#fff; border-right:1px solid var(--line); padding:10px 8px; font-size:13px; }
.offnav h4{ margin:10px 8px 4px; font-size:11px; color:var(--muted); letter-spacing:.05em; }
.offnav button{ display:flex; justify-content:space-between; width:100%; text-align:left; border:0; background:transparent; padding:6px 10px; border-radius:7px; }
.offnav button:hover{ background:var(--cream); }
.offnav button[aria-current="page"]{ background:var(--goldt); font-weight:700; color:var(--navy); }
.offnav .badge{ background:var(--red); color:#fff; font-size:10.5px; border-radius:999px; padding:0 6px; font-weight:700; }
.vp{ padding:14px 18px 30px; min-width:0; }
.h1{ font-size:20px; margin:0 0 2px; color:var(--navy); } .sub{ color:var(--muted); font-size:12.5px; margin:0 0 12px; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.row.sb{ justify-content:space-between; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.card > header{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.card > header h2{ margin:0; font-size:15px; color:var(--navy); }
.card .body{ padding:12px 14px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; } .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.btn{ border:1px solid var(--line2); background:#fff; color:var(--navy); border-radius:8px; padding:7px 14px; min-height:36px; font-weight:700; font-size:13.5px; white-space:nowrap; }
.btn:hover{ background:var(--cream); }
.btn.pri{ background:var(--gold); border-color:var(--gold); color:#fff; } .btn.pri:hover{ background:var(--goldd); }
.btn.navy{ background:var(--navy); border-color:var(--navy); color:#fff; }
.btn.danger{ color:var(--red); border-color:#e3b9b9; }
.btn.sm{ min-height:28px; padding:3px 10px; font-size:12.5px; font-weight:600; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.pill{ display:inline-flex; align-items:center; border-radius:999px; padding:1px 9px; font-size:11.5px; font-weight:800; white-space:nowrap; }
.pill.gray{ background:#ecebe6; color:#555; } .pill.blue{ background:var(--infobg); color:var(--blue); } .pill.amber{ background:var(--warnbg); color:var(--amber); } .pill.green{ background:var(--okbg); color:var(--green); } .pill.red{ background:var(--ngbg); color:var(--red); } .pill.navy{ background:var(--navy); color:#fff; } .pill.gold{ background:var(--goldt); color:var(--goldd); }
.field{ display:grid; gap:4px; margin-bottom:10px; } .field > label{ font-size:12px; font-weight:700; color:var(--muted); }
.field input,.field select,.field textarea,.inp{ border:1px solid var(--line2); border-radius:7px; padding:6px 9px; min-height:34px; background:#fff; width:100%; }
.field small{ color:var(--muted); font-size:11.5px; }
.err{ color:var(--red); font-size:12.5px; } .note{ color:var(--muted); font-size:12px; }
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ background:#f2efe6; color:var(--navy); font-size:12px; text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap; }
.tbl td{ padding:7px 9px; border-bottom:1px solid #eee9de; vertical-align:middle; }
.tbl .num,.tbl td.nw{ white-space:nowrap; }
.invgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(480px,1fr)); gap:12px; align-items:start; }
.invgrid .paper.a4{ width:100%; max-width:640px; }
.tbl tr:hover td{ background:#fbfaf6; } .tbl td.r,.tbl th.r{ text-align:right; } .tbl td.c,.tbl th.c{ text-align:center; }
.tbl tr.sel td{ background:#fbf3df; }
.tbl a,.lnk{ color:var(--blue); text-decoration:underline; cursor:pointer; background:none; border:0; padding:0; font:inherit; }
.kpi{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.kpi b{ display:block; font-size:24px; color:var(--navy); } .kpi span{ color:var(--muted); font-size:12px; }
.kpi.warn{ border-color:var(--warnline,#e9c46a); background:#fffaf0; } .kpi.ng{ border-color:#e3b9b9; background:#fff6f6; }
.alert{ border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
.alert.warn{ background:var(--warnbg); color:#6d4c00; } .alert.ng{ background:var(--ngbg); color:#8a2222; } .alert.ok{ background:var(--okbg); color:#145238; } .alert.info{ background:var(--infobg); color:#1d4a7a; }
.tabs{ display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:10px; }
.tabs button{ border:0; background:transparent; padding:7px 14px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px; }
.tabs button[aria-pressed="true"]{ color:var(--navy); border-bottom-color:var(--gold); }
.tabs .cnt{ font-size:11px; background:#ecebe6; border-radius:999px; padding:0 7px; margin-left:4px; }
.empty{ color:var(--muted); padding:18px; text-align:center; }

/* ---------- 受入日報 ---------- */
.rbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:#fff; border-bottom:1px solid var(--line); }
.rbar .date{ font-size:18px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:6px; }
.rbar .date button{ border:1px solid var(--line2); background:#fff; border-radius:6px; width:28px; height:28px; }
.rbar .count{ background:var(--navy); color:#fff; border-radius:8px; padding:3px 12px; font-weight:800; }
.rbar .count b{ font-size:18px; margin-left:4px; }
.rbar .now{ color:var(--muted); font-size:12.5px; }
.convoybar{ background:#fbf3df; border-bottom:1px solid #ecd9ab; padding:6px 14px; font-size:13px; display:flex; gap:10px; align-items:center; }
.daily-wrap{ overflow:auto; max-height:560px; background:#fff; }
table.daily{ border-collapse:separate; border-spacing:0; width:100%; font-size:13px; min-width:980px; }
.daily th{ position:sticky; top:0; z-index:2; background:var(--navy); color:#fff; font-weight:700; padding:6px 4px; text-align:center; font-size:12.5px; border-right:1px solid #2c3a63; }
.daily th.hcur{ background:var(--gold); }
.daily td{ border-right:1px solid #e3ddcf; border-bottom:1px solid #e3ddcf; padding:0; height:44px; }
.daily td.cust{ padding:4px 8px; width:150px; vertical-align:top; background:#fdfcf8; }
.daily td.cust b{ display:block; font-size:13.5px; } .daily td.cust small{ color:var(--muted); font-size:11.5px; }
.daily td.vno{ width:56px; text-align:center; font-weight:700; } .daily td.item{ width:96px; padding:0 6px; white-space:nowrap; }
.daily td.cnt{ width:56px; text-align:center; font-weight:800; font-size:16px; color:var(--navy); background:#fdfcf8; vertical-align:top; padding-top:10px; }
.daily td.chk{ width:30px; text-align:center; }
.daily tr.grpend td{ border-bottom:2px solid #b9b1a0; }
.daily tr.addv td{ height:26px; } .daily tr.addv button{ border:0; background:transparent; color:var(--blue); font-size:12px; padding:3px 8px; }
.cell{ position:relative; width:100%; height:100%; min-height:44px; display:flex; flex-wrap:wrap; align-content:center; gap:2px 3px; padding:3px 4px; }
.daily td.hc{ width:74px; }
.daily td.hc.past .cell{ cursor:pointer; } .daily td.hc.cur{ background:#fffaf0; } .daily td.hc.cur .cell{ cursor:pointer; }
.daily td.hc.fut{ background:#f6f5f1; } .daily td.hc.fut .cell{ cursor:not-allowed; }
.daily td.hc .cell:hover{ outline:2px solid var(--gold); outline-offset:-2px; }
.daily td.hc.cur .cell:empty::after{ content:"＋"; color:#c9a75d; font-size:18px; margin:auto; }
.chip{ border:0; border-radius:5px; padding:0 4px; font-weight:800; font-size:13px; line-height:18px; background:transparent; color:var(--ink); font-variant-numeric:tabular-nums; }
.chip:hover{ background:#eee7d6; }
.chip.kusa{ background:var(--kusat); color:var(--kusa); } .chip.maru{ background:var(--mudt); color:var(--mud); }
.chip .mk{ font-size:11px; margin-left:1px; } .chip .mkl{ font-size:11px; margin-right:1px; }
.chip.saving{ color:#999; } .chip.lock{ text-decoration:underline dotted #8a8; }
.more{ font-size:11px; color:var(--muted); font-weight:700; }
.legend{ display:flex; gap:14px; font-size:12px; color:var(--muted); padding:6px 14px; background:#fff; border-top:1px solid var(--line); flex-wrap:wrap; }

/* ---------- ダイアログ ---------- */
.ov{ position:absolute; inset:0; background:#16213c55; display:grid; place-items:center; z-index:20; padding:16px; }
.dlg{ background:#fff; border-radius:12px; box-shadow:0 12px 40px #0005; width:min(640px,100%); max-height:100%; overflow:auto; }
.dlg.wide{ width:min(980px,100%); } .dlg.narrow{ width:min(420px,100%); }
.dlg > header{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:1; }
.dlg > header h2{ margin:0; font-size:16px; color:var(--navy); }
.dlg .x{ border:0; background:transparent; font-size:22px; line-height:1; }
.dlg .body{ padding:14px 16px; } .dlg > footer{ display:flex; justify-content:flex-end; gap:8px; padding:10px 16px; border-top:1px solid var(--line); position:sticky; bottom:0; background:#fff; }
.pop{ position:absolute; z-index:15; background:#fff; border:1px solid var(--line2); border-radius:10px; box-shadow:0 8px 26px #0003; padding:10px; width:260px; font-size:13px; }
.pop h4{ margin:0 0 6px; font-size:13px; color:var(--navy); }
.markbtns{ display:flex; gap:6px; margin:6px 0; }
.markbtns button{ flex:1; border:2px solid var(--line2); background:#fff; border-radius:8px; padding:8px 0; font-weight:800; font-size:16px; }
.markbtns button.kusa{ color:var(--kusa); border-color:#9cc8a8; } .markbtns button.maru{ color:var(--mud); border-color:#d6b59e; }
.markbtns button[aria-pressed="true"]{ background:var(--goldt); border-color:var(--gold); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; } .chips button{ border:1px solid var(--line2); background:#fff; border-radius:999px; padding:4px 12px; font-size:13px; }
.chips button[aria-pressed="true"]{ background:var(--navy); color:#fff; border-color:var(--navy); }
.kana{ display:flex; gap:3px; flex-wrap:wrap; margin-bottom:6px; } .kana button{ border:1px solid var(--line2); background:#fff; border-radius:6px; width:30px; height:28px; font-size:13px; }
.kana button[aria-pressed="true"]{ background:var(--gold); color:#fff; border-color:var(--gold); }
.pick{ max-height:190px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.pick button{ display:block; width:100%; text-align:left; border:0; border-bottom:1px solid #f0ece2; background:#fff; padding:7px 10px; }
.pick button[aria-pressed="true"]{ background:var(--goldt); font-weight:700; }

/* ---------- 伝票・タブレット ---------- */
.slipdoc{ border:2px solid var(--navy); border-radius:6px; padding:14px 16px; background:#fff; }
.slipdoc h3{ margin:0; font-size:18px; letter-spacing:.2em; color:var(--navy); }
.slipdoc .meta{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin:4px 0 10px; }
.slipdoc .to{ font-size:18px; font-weight:800; border-bottom:1px solid var(--ink); display:inline-block; padding:0 20px 2px 0; }
.slipdoc table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13.5px; } .slipdoc th,.slipdoc td{ border:1px solid #888; padding:5px 8px; }
.sigbox{ border:1px dashed #999; height:90px; border-radius:6px; display:grid; place-items:center; color:#aaa; background:#fcfcfa; }
.sigbox svg{ width:100%; height:100%; }
.tabscr{ min-height:760px; display:flex; flex-direction:column; }
.tabhead{ background:var(--navy); color:#fff; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; }
.tabbody{ flex:1; padding:18px; display:flex; flex-direction:column; gap:12px; }
.tabbig{ font-size:20px; } .tabbig td,.tabbig th{ font-size:18px; padding:8px; }
canvas.sign{ width:100%; height:200px; background:#fff; border:2px solid var(--navy); border-radius:10px; touch-action:none; cursor:crosshair; }
.twait{ flex:1; display:grid; place-items:center; text-align:center; color:var(--muted); }
.twait b{ display:block; font-size:24px; color:var(--navy); margin-bottom:6px; }

/* ---------- 請求書・日報の見本 ---------- */
.paper{ background:#fff; box-shadow:0 2px 12px #0002; padding:28px 32px; color:#111; font-size:12px; margin:0 auto; }
.paper.a4{ width:640px; min-height:900px; } .paper.a3{ width:100%; }
.paper h1{ text-align:center; letter-spacing:.6em; font-size:22px; margin:0 0 10px; }
.paper table{ width:100%; border-collapse:collapse; } .paper th,.paper td{ border:1px solid #444; padding:3px 6px; }
.paper th{ background:#eee; font-weight:700; } .paper .r{ text-align:right; }
.paper .big{ font-size:20px; font-weight:800; border-bottom:2px solid #111; padding:4px 10px; display:inline-block; }
.stamp{ position:absolute; right:40px; top:40px; border:3px solid var(--red); color:var(--red); font-weight:900; padding:4px 10px; transform:rotate(-8deg); font-size:18px; }

/* ---------- freee ---------- */
.fbox{ border:1px solid var(--line); border-radius:10px; padding:12px; background:#fff; }
.fhead{ display:flex; gap:8px; align-items:center; } .flogo{ background:#2864f0; color:#fff; font-weight:900; border-radius:6px; padding:2px 8px; font-size:13px; }
dl.kv{ display:grid; grid-template-columns:120px 1fr; gap:4px 10px; margin:0; font-size:13px; } dl.kv dt{ color:var(--muted); } dl.kv dd{ margin:0; }
.consent{ background:#fff; border-radius:12px; width:min(460px,100%); overflow:hidden; box-shadow:0 12px 40px #0006; }
.consent header{ background:#2864f0; color:#fff; padding:12px 16px; font-weight:800; }

/* ---------- トースト ---------- */

<script>
/* ===== packages/billing/billing.js（11 計算仕様書の実装。正解データで検証済み）をそのまま埋め込み ===== */
/* SoilFlow 請求計算（11 計算仕様書の実装）
 * 画面・DB・API から独立した純粋な関数だけで構成する。
 * Node（require）とブラウザ（window.SFBilling）の両方で同じコードを使う。
 * 金額はすべて整数（円）。日付は 'YYYY-MM-DD' の文字列で扱い、タイムゾーンに依存させない。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SFBilling = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- 日付 ---------- */
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // m: 1-12
  const parseYm = (ym) => { const [y, m] = ym.split('-').map(Number); return { y, m }; };
  const addMonths = (y, m, k) => { const t = y * 12 + (m - 1) + k; return { y: Math.floor(t / 12), m: (t % 12) + 1 }; };

  /** 締め日 closingDay（0＝月末、1〜28）の、対象月 ym の請求期間 [from, to]（11 計算仕様書 4.1） */
  function billingPeriod(ym, closingDay) {
    const { y, m } = parseYm(ym);
    const dayOf = (yy, mm) => (closingDay === 0 ? lastDay(yy, mm) : Math.min(closingDay, lastDay(yy, mm)));
    const to = ymd(y, m, dayOf(y, m));
    const p = addMonths(y, m, -1);
    const prevTo = dayOf(p.y, p.m);
    const from = prevTo === lastDay(p.y, p.m) ? ymd(y, m, 1) : ymd(p.y, p.m, prevTo + 1);
    return { from, to };
  }

  /** 入金期日：締め日の月から offsetMonths か月後の payDay（0＝末日）。その月にない日は末日（4.3） */
  function dueDate(periodTo, offsetMonths, payDay) {
    const { y, m } = parseYm(periodTo.slice(0, 7));
    const t = addMonths(y, m, offsetMonths);
    const ld = lastDay(t.y, t.m);
    return ymd(t.y, t.m, payDay === 0 ? ld : Math.min(payDay, ld));
  }

  /* ---------- 便の品目・単価・請求先 ---------- */

  /** 便の品目＝印の切り替え規則（印×行の品目）があれば切り替え先、なければ行の品目（3.1） */
  function effectiveItemId(rowItemId, markId, markRules) {
    if (!markId) return rowItemId;
    const r = markRules.find((x) => x.markId === markId && x.fromItemId === rowItemId);
    return r ? r.toItemId : rowItemId;
  }

  /** 便の日付に適用される単価表：適用開始日が便の日付以前で最も新しいもの（3.2） */
  function priceTableFor(date, priceTables) {
    let best = null;
    for (const t of priceTables) if (t.effectiveFrom <= date && (!best || t.effectiveFrom > best.effectiveFrom)) best = t;
    return best;
  }

  /** 単価（1台・税抜）。見つからなければ null */
  function unitPrice(date, itemId, vehicleClassId, priceTables) {
    const t = priceTableFor(date, priceTables);
    if (!t) return null;
    const e = t.entries.find((x) => x.itemId === itemId && x.vehicleClassId === vehicleClassId);
    return e && Number.isInteger(e.unitPrice) ? e.unitPrice : null;
  }

  /** 参考値：㎥単価×容量（＋4t車以下の積込料加算）。価格表の照合に使う（3.3） */
  function referencePrice(pricePerM3, capacityM3, smallVehicle, smallLoadingFee) {
    if (pricePerM3 == null) return null;
    return Math.round(pricePerM3 * capacityM3) + (smallVehicle ? smallLoadingFee || 0 : 0);
  }

  const SLIP_EFFECTIVE = new Set(['DRAFT', 'AWAITING_SIGNATURE', 'SIGNED', 'PAPER_PRINTED', 'PAPER_SIGNED']);

  /** 便の請求先：①伝票（取消以外）の請求先 ②現場の既定 ③客先の既定（3.4） */
  function billingPartyIdFor(trip, row, ctx) {
    if (trip.slipId) {
      const s = ctx.slips.find((x) => x.id === trip.slipId);
      if (s && SLIP_EFFECTIVE.has(s.status) && s.billingPartyId) return s.billingPartyId;
    }
    const site = row.siteId ? ctx.sites.find((x) => x.id === row.siteId) : null;
    if (site && site.defaultBillingPartyId) return site.defaultBillingPartyId;
    const c = ctx.customers.find((x) => x.id === row.customerId);
    return c ? c.defaultBillingPartyId : null;
  }

  /* ---------- 消費税 ---------- */

  /** 税率 ratePercent（整数）の税額。端数処理 mode：floor（切り捨て）／round（四捨五入）／ceil（切り上げ）（4.5） */
  function taxOf(subtotal, ratePercent, mode) {
    const n = subtotal * ratePercent; // 100倍の税額（整数）
    if (mode === 'ceil') return Math.ceil(n / 100);
    if (mode === 'round') return Math.floor((n + 50) / 100);
    return Math.floor(n / 100);
  }

  const invoiceNo = (periodTo, seq) => `SF-${periodTo.slice(2, 4)}${periodTo.slice(5, 7)}-${pad(seq, 3)}`;

  /* ---------- 請求書の作成 ---------- */

  /**
   * 対象月 ym の締めで請求書を作る（4章）。
   * ctx: { rows, trips, slips, sites, customers, billingParties, items, vehicleClasses, priceTables, markRules,
   *        taxRate=10, rounding='floor', billingPartyIds?（対象を絞る場合）, seqStart=1 }
   * trips の各要素：{ id, rowId, date, time, markId, status: 'ACTIVE'|'CANCELLED', slipId, lockedInvoiceId? }
   * 戻り値：{ invoices, problems }
   */
  function buildInvoices(ym, ctx) {
    const taxRate = ctx.taxRate ?? 10, rounding = ctx.rounding || 'floor';
    const byId = (arr) => new Map(arr.map((x) => [x.id, x]));
    const rows = byId(ctx.rows), items = byId(ctx.items), vcs = byId(ctx.vehicleClasses), sites = byId(ctx.sites), bps = byId(ctx.billingParties);
    const target = ctx.billingParties.filter((b) => b.active !== false && (!ctx.billingPartyIds || ctx.billingPartyIds.includes(b.id)));
    const periods = new Map(target.map((b) => [b.id, billingPeriod(ym, b.closingDay)]));
    const problems = [];
    const buckets = new Map(); // bpId -> Map(key -> line)
    const tripIdsOf = new Map();
    const blocked = new Set();

    for (const t of ctx.trips) {
      if (t.status !== 'ACTIVE') continue;
      const row = rows.get(t.rowId);
      if (!row) { problems.push({ kind: 'ROW_MISSING', tripId: t.id }); continue; }
      const bpId = billingPartyIdFor(t, row, ctx);
      if (!bpId) { problems.push({ kind: 'BILLING_PARTY_MISSING', tripId: t.id, date: t.date }); continue; }
      const per = periods.get(bpId);
      if (!per || t.date < per.from || t.date > per.to) continue;
      if (t.lockedInvoiceId) { problems.push({ kind: 'ALREADY_INVOICED', tripId: t.id, billingPartyId: bpId, invoiceId: t.lockedInvoiceId }); continue; }
      const itemId = effectiveItemId(row.itemId, t.markId, ctx.markRules);
      const price = unitPrice(t.date, itemId, row.vehicleClassId, ctx.priceTables);
      if (price === null) {
        problems.push({ kind: 'PRICE_MISSING', tripId: t.id, billingPartyId: bpId, date: t.date, itemId, vehicleClassId: row.vehicleClassId });
        blocked.add(bpId); continue;
      }
      const key = [row.siteId || '', itemId, row.vehicleClassId, price].join('|');
      if (!buckets.has(bpId)) { buckets.set(bpId, new Map()); tripIdsOf.set(bpId, []); }
      const b = buckets.get(bpId);
      if (!b.has(key)) b.set(key, { siteId: row.siteId || null, itemId, vehicleClassId: row.vehicleClassId, unitPrice: price, tripCount: 0, amount: 0 });
      const ln = b.get(key); ln.tripCount += 1; ln.amount += price;
      tripIdsOf.get(bpId).push(t.id);
    }

    const kanaOf = (bp) => bp.kana || bp.name;
    const order = [...buckets.keys()].filter((id) => !blocked.has(id)).sort((a, b) => kanaOf(bps.get(a)).localeCompare(kanaOf(bps.get(b)), 'ja') || (a < b ? -1 : 1));
    const seqByMonth = {};
    const invoices = order.map((bpId) => {
      const bp = bps.get(bpId), per = periods.get(bpId);
      const siteKey = (id) => { const s = id && sites.get(id); return s ? (s.kana || s.name) : ''; };
      const lines = [...buckets.get(bpId).values()].sort((x, y) =>
        siteKey(x.siteId).localeCompare(siteKey(y.siteId), 'ja') ||
        (items.get(x.itemId).sortOrder - items.get(y.itemId).sortOrder) ||
        (vcs.get(x.vehicleClassId).sortOrder - vcs.get(y.vehicleClassId).sortOrder) ||
        (x.unitPrice - y.unitPrice));
      lines.forEach((l, i) => { l.lineNo = i + 1; });
      const subtotal = lines.reduce((a, l) => a + l.amount, 0);
      const taxAmount = taxOf(subtotal, taxRate, rounding);
      const ymKey = per.to.slice(0, 7);
      seqByMonth[ymKey] = (seqByMonth[ymKey] ?? (ctx.seqStart || 1) - 1) + 1;
      return {
        invoiceNo: invoiceNo(per.to, seqByMonth[ymKey]), billingPartyId: bpId, periodFrom: per.from, periodTo: per.to,
        issueDate: per.to, dueDate: dueDate(per.to, bp.paymentMonthOffset ?? 1, bp.paymentDay ?? 0),
        lines, subtotal, taxRate, taxAmount, total: subtotal + taxAmount, tripIds: tripIdsOf.get(bpId).slice().sort(),
      };
    });
    for (const id of blocked) problems.push({ kind: 'INVOICE_BLOCKED', billingPartyId: id });
    return { invoices, problems };
  }

  /* ---------- freee の取引の明細（5章） ---------- */

  /**
   * 請求書の明細を freee の「勘定科目×税区分×品目」でまとめ、税込金額（amount）と消費税額（vat）を返す。
   * Σvat ＝ 請求書の消費税額、Σamount ＝ 請求書の合計 になるよう、端数の差を金額の大きい明細から1円ずつ配る。
   * mapping: itemId -> { accountItemId, taxCode, freeeItemId|null }。未設定があれば { error } を返す。
   */
  function freeeDetails(invoice, mapping, rounding) {
    const groups = new Map(), missing = [];
    for (const l of invoice.lines) {
      const m = mapping[l.itemId];
      if (!m || !m.accountItemId || m.taxCode == null) { missing.push(l.itemId); continue; }
      const key = [m.accountItemId, m.taxCode, m.freeeItemId ?? ''].join('|');
      if (!groups.has(key)) groups.set(key, { accountItemId: m.accountItemId, taxCode: m.taxCode, freeeItemId: m.freeeItemId ?? null, subtotal: 0, firstLine: l.lineNo });
      groups.get(key).subtotal += l.amount;
    }
    if (missing.length) return { error: 'ITEM_MAPPING_MISSING', itemIds: [...new Set(missing)] };
    const list = [...groups.values()].sort((a, b) => a.firstLine - b.firstLine);
    if (list.length > 100) return { error: 'TOO_MANY_DETAILS', count: list.length };
    list.forEach((g) => { g.vat = taxOf(g.subtotal, invoice.taxRate, rounding || 'floor'); });
    let diff = invoice.taxAmount - list.reduce((a, g) => a + g.vat, 0);
    const prio = list.map((g, i) => ({ g, i })).sort((a, b) => b.g.subtotal - a.g.subtotal || a.i - b.i);
    for (let k = 0; diff !== 0; k = (k + 1) % prio.length) { const s = Math.sign(diff); prio[k].g.vat += s; diff -= s; }
    return { details: list.map((g) => ({ accountItemId: g.accountItemId, taxCode: g.taxCode, itemId: g.freeeItemId, amount: g.subtotal + g.vat, vat: g.vat })) };
  }

  /* ---------- 日報の台数 ---------- */

  /** 行ごと・客先ごと・日計の台数（取消を除く）（2章） */
  function tripCounts(rows, trips) {
    const byRow = {}, byCustomer = {}; let total = 0;
    const rowMap = new Map(rows.map((r) => [r.id, r]));
    for (const t of trips) {
      if (t.status !== 'ACTIVE') continue;
      const r = rowMap.get(t.rowId); if (!r) continue;
      byRow[r.id] = (byRow[r.id] || 0) + 1;
      byCustomer[r.customerId] = (byCustomer[r.customerId] || 0) + 1;
      total += 1;
    }
    return { byRow, byCustomer, total };
  }

  /** 時刻 'HH:MM' の時間帯の列（範囲外は端の列にまとめる）（2.2） */
  function hourSlot(time, firstHour, lastHour) {
    const h = Number(time.slice(0, 2));
    return Math.min(Math.max(h, firstHour), lastHour);
  }

  return { billingPeriod, dueDate, effectiveItemId, priceTableFor, unitPrice, referencePrice, billingPartyIdFor, taxOf, invoiceNo, buildInvoices, freeeDetails, tripCounts, hourSlot };
});

</script>
<script>

/* =====================================================================
   SoilFlow 試作画面 1.0 — データと業務の決まり
   計算は packages/billing（11 計算仕様書）と同じ関数 SFBilling を使う。
   データはこのブラウザの中（localStorage）だけに保存する。
   ===================================================================== */
const B = window.SFBilling;
const KEY = 'soilflow-mock-1.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => (n == null ? '—' : Number(n).toLocaleString('ja-JP'));
const pad = (n, w = 2) => String(n).padStart(w, '0');
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dObj = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); };
const dStr = (o) => `${o.getUTCFullYear()}-${pad(o.getUTCMonth() + 1)}-${pad(o.getUTCDate())}`;
const addDays = (d, k) => { const o = dObj(d); o.setUTCDate(o.getUTCDate() + k); return dStr(o); };
const wday = (d) => dObj(d).getUTCDay();
const jdate = (d) => { const o = dObj(d); return `${o.getUTCFullYear()}年${o.getUTCMonth() + 1}月${o.getUTCDate()}日（${WD[o.getUTCDay()]}）`; };
const mdate = (d) => (d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : '—');
const toMin = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
const tStr = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const isBizDay = (d) => wday(d) !== 0 && wday(d) !== 6;
const prevBizDay = (d) => { let x = addDays(d, -1); while (!isBizDay(x)) x = addDays(x, -1); return x; };
const ymOf = (d) => d.slice(0, 7);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

let S;
const id = (p) => `${p}${(S.seq = (S.seq || 0) + 1)}`;
const by = (arr, k) => arr.find((x) => x.id === k);
const M = () => S.m;
const cust = (k) => by(M().customers, k), site = (k) => (k ? by(M().sites, k) : null), bp = (k) => by(M().billingParties, k);
const item = (k) => by(M().items, k), vc = (k) => by(M().vehicleClasses, k), veh = (k) => by(M().vehicles, k), mark = (k) => (k ? by(M().marks, k) : null);
const user = (k) => by(M().users, k);
const me = () => (S.userId ? user(S.userId) : null);
const role = () => me()?.role;
const ROLE_JA = { RECEPTION: '受付', OFFICE: '本社', ADMIN: '管理者', SIGN_TERMINAL: 'サイン端末' };
const isOffice = () => ['OFFICE', 'ADMIN'].includes(role());
const isAdmin = () => role() === 'ADMIN';

/* ---------------- マスタの初期値（seed.sql と同じ内容。客先などは【デモ】） ---------------- */
function seedMasters() {
  const vcs = [['vc10', '10t', 5.5, false], ['vc8', '8t', 4.4, false], ['vc6', '6t', 3.3, false], ['vc4', '4t', 2.2, true], ['vc3', '3t', 1.7, true], ['vc2', '2t', 1.1, true], ['vc1', '1t', 0.6, true]]
    .map(([id, name, capacityM3, smallVehicle], i) => ({ id, name, capacityM3, smallVehicle, sortOrder: i + 1, active: true }));
  const P = [ // id, 日報表記, 価格表品目, 区分, ㎥単価, 加算, 金額（10t〜1t）  ← reference/価格表_2023-04.csv
    ['it_h12', '残土', '建設発生土1〜2種', 'RECEIVE', 1500, 0, [8250, 6600, 4950, 3300, 2550, 1650, 900]],

    ['it_k34', '残土（3〜4種・草根）', '建設発生土（草根混）3〜4種', 'RECEIVE', 4000, 0, [22000, 17600, 13200, 8800, 6800, 4400, 2400]],

    ['it_syi', 'ストック受入', 'ストックヤード受入', 'RECEIVE', 1500, 0, [8250, 6600, 4950, 3300, 2550, 1650, 900]],
    ['it_syo', 'ストック搬出', 'ストックヤード搬出（積込料）', 'DELIVER', null, 0, [2000, 2000, 2000, 1000, 1000, 1000, 1000]],

/* ---------- SCR-10 受入日報（受付・本社で共用） ---------- */
function dailyTable(date) {
  const st = M().settings, hours = []; for (let h = st.reportFirstHour; h <= st.reportLastHour; h++) hours.push(h);
  const rows = S.rows.filter((r) => r.date === date && !r.deleted);
  const groups = []; const gmap = {};
  rows.sort((a, b) => a.sort - b.sort).forEach((r) => { if (!gmap[r.customerId]) { gmap[r.customerId] = { cid: r.customerId, rows: [] }; groups.push(gmap[r.customerId]); } gmap[r.customerId].rows.push(r); });
  const c = counts(date); const sel = S.ui.sel || [];
  const curH = date === S.today ? Math.min(Math.max(nowSlot(), st.reportFirstHour), st.reportLastHour) : null;
  const head = `<tr><th class="chk" title="まとめて記入する行を選ぶ">車列</th><th>会社名／現場</th><th>車番</th><th>品名</th>${hours.map((h) => `<th class="${h === curH ? 'hcur' : ''}">${h}</th>`).join('')}<th>台数</th></tr>`;
  const body = groups.map((g) => {
    const cu = cust(g.cid); const sites = [...new Set(g.rows.map((r) => site(r.siteId)?.name).filter(Boolean))]; const multi = sites.length > 1;
    const trs = g.rows.map((r, i) => {
      const ts = S.trips.filter((t) => t.rowId === r.id && t.status === 'ACTIVE').sort((a, b) => (a.time < b.time ? -1 : 1));
      const cells = hours.map((h) => {
        const st2 = cellState(date, h); const inCell = ts.filter((t) => B.hourSlot(t.time, st.reportFirstHour, st.reportLastHour) === h);
        const shown = inCell.slice(0, 4).map((t) => { const m = mark(t.markId); const lk = lockOf(t); const mm = t.time.slice(3);
          return `<button class="chip ${m ? m.cls : ''} ${lk ? 'lock' : ''}" data-a="chip" data-t="${t.id}" title="${esc(t.time)}${m ? ' ' + m.displayName : ''}${lk ? '（' + (lk.kind === 'SLIP' ? '伝票' : '請求書') + 'で固定）' : ''}">${m && m.symbol === '○' ? `<span class="mkl">○</span>${mm}` : `${mm}${m ? `<span class="mk">${esc(m.symbol)}</span>` : ''}`}</button>`; }).join('');
        return `<td class="hc ${st2}" data-row="${r.id}" data-h="${h}"><div class="cell" data-a="cell" data-row="${r.id}" data-h="${h}">${shown}${inCell.length > 4 ? `<span class="more">＋${inCell.length - 4}</span>` : ''}</div></td>`;
      }).join('');
      const first = i === 0;
      return `<tr class="${i === g.rows.length - 1 ? 'grpend' : ''}"><td class="chk"><input type="checkbox" aria-label="${esc(rowLabel(r))} をまとめて記入に加える" data-a="sel" data-row="${r.id}" ${sel.includes(r.id) ? 'checked' : ''}></td>
        ${first ? `<td class="cust" rowspan="${g.rows.length + 1}"><b>${esc(cu.name)}</b><small>${esc(sites.join('・'))}</small></td>` : ''}
        <td class="vno"><button class="lnk" data-a="rowedit" data-row="${r.id}" title="行を直す" style="color:var(--ink);text-decoration:none;font-weight:700">${esc(veh(r.vehicleId).vehicleNo)}</button></td><td class="item">${esc(item(r.itemId).reportLabel)}${esc(vc(r.vehicleClassId).name)}${multi && r.siteId ? `<br><small class="note">${esc(site(r.siteId).name)}</small>` : ''}</td>${cells}
        ${first ? `<td class="cnt num" rowspan="${g.rows.length + 1}">${c.byCustomer[g.cid] || 0}</td>` : ''}</tr>`;
    }).join('');
    return trs + `<tr class="addv"><td></td><td colspan="${hours.length + 2}"><button data-a="addveh" data-c="${g.cid}" data-row="${g.rows[g.rows.length - 1].id}">＋ 車番を追加（${esc(cu.name)}）</button></td></tr>`;
  }).join('');
  return { html: `<div class="daily-wrap"><table class="daily">${head}${body || `<tr><td colspan="${hours.length + 5}" class="empty">この日の行はまだありません。</td></tr>`}</table></div>`, total: c.total, hasRows: rows.length > 0 };
}

/* SCR-14 伝票発行 */
DLG.slip = (d) => {

  return `<div class="dlg wide" role="dialog" aria-label="伝票発行"><header><h2>伝票発行（SCR-14）　${jdate(date)}</h2><button class="x" data-a="dlgclose" aria-label="閉じる">×</button></header><div class="body">
    <div style="display:grid;grid-template-columns:260px 1fr;gap:14px"><div><div class="field"><label>伝票未発行の便がある客先・現場</label><div class="pick" style="max-height:420px">${left || '<p class="empty">伝票未発行の便はありません</p>'}</div></div></div>
    <div>${g ? `<div class="slipdoc"><div class="row sb"><h3>納品伝票（受入）</h3><span class="pill gray">発行前の確認</span></div><div class="meta"><span>No. （発行時に採番）</span><span>${jdate(date)}</span></div>
      <span class="to">${esc(cust(g.customerId).name)} 様</span>　現場：${esc(site(g.siteId)?.name || '—')}
      <table><tr><th>品名</th><th style="width:60px">台数</th><th>車番</th></tr>${lines.map((l) => `<tr><td>${esc(l.itemLabel)}</td><td class="c">${l.tripCount}</td><td>${esc(l.vehicleNos)}</td></tr>`).join('')}<tr><td><b>合計</b></td><td class="c"><b>${lines.reduce((a, l) => a + l.tripCount, 0)}</b></td><td></td></tr></table></div>
      <div class="field" style="margin-top:12px"><label>請求先（既定：${esc(bp(def).name)}${site(g.siteId)?.defaultBillingPartyId ? '＝現場の既定（ケースC）' : bp(def).name !== cust(g.customerId).name ? '＝客先の既定（ケースB）' : ''}）</label>

};

/* ---------- SCR-20〜22 サイン用タブレット ---------- */

  const ic = {}; S.invoices.forEach((i) => { ic[i.status] = (ic[i.status] || 0) + 1; }); const fc = {}; S.fr.regs.forEach((r) => { fc[r.status] = (fc[r.status] || 0) + 1; });

    <h3 style="margin:14px 0 6px;color:var(--navy)">本日の受入</h3><div class="grid3"><div class="kpi"><span>本日の台数</span><b class="num">${c.total}</b></div><div class="kpi ${aw ? 'warn' : ''}"><span>サイン待ちの伝票</span><b>${aw}</b></div><div class="kpi ${un ? 'warn' : ''}"><span>伝票未発行の便</span><b>${un}</b></div></div>

    <h3 style="margin:14px 0 6px;color:var(--navy)">freee 会計</h3><div class="grid4"><div class="kpi ${S.fr.conn.status !== 'CONNECTED' ? 'ng' : ''}"><span>連携</span><b style="font-size:16px">${S.fr.conn.status === 'CONNECTED' ? '連携中' : S.fr.conn.status === 'REAUTH_REQUIRED' ? '再連携が必要' : '未連携'}</b><span>${S.fr.conn.mode === 'AUTO' ? '自動登録' : '確認してから登録'}</span></div>${['PENDING', 'NEEDS_ACTION', 'ERROR'].map((k) => `<div class="kpi ${k !== 'PENDING' && fc[k] ? 'warn' : ''}"><span>${REG_JA[k]}</span><b>${fc[k] || 0}</b></div>`).join('')}</div>`);

/* ---------- SCR-33 集計 ---------- */
const GB = { customer: ['客先', (t, r) => [r.customerId, cust(r.customerId).name]], site: ['現場', (t, r) => [r.siteId || '-', site(r.siteId)?.name || '（なし）']], billingParty: ['請求先', (t, r) => { const k = B.billingPartyIdFor(t, r, ctxFor()); return [k, bp(k).name]; }], item: ['品目', (t) => { const k = tripItem(t); return [k, item(k).priceItemName]; }], vehicleClass: ['車格', (t, r) => [r.vehicleClassId, vc(r.vehicleClassId).name]], date: ['日付', (t) => [t.date, t.date]] };
function aggregate(f) {
  const ctx = ctxFor(); const keys = f.groupBy; const out = {};
  S.trips.filter((t) => t.status === 'ACTIVE' && t.date >= f.from && t.date <= f.to).forEach((t) => {
    const r = by_row(t.rowId); const ks = keys.map((k) => GB[k][1](t, r)); const key = ks.map((x) => x[0]).join('|');
    const p = B.unitPrice(t.date, tripItem(t), r.vehicleClassId, ctx.priceTables);
    (out[key] ||= { labels: ks.map((x) => x[1]), trips: 0, amount: 0, miss: 0 }); out[key].trips++; if (p == null) out[key].miss++; else out[key].amount += p;
  });
  return Object.values(out).sort((a, b) => a.labels.join().localeCompare(b.labels.join(), 'ja'));
}
VIEWS.agg = () => {
  const f = S.ui.ag ||= { from: `${S.today.slice(0, 8)}01`, to: S.today, groupBy: ['customer', 'item'] };
  const rows = aggregate(f); const tot = rows.reduce((a, r) => ({ trips: a.trips + r.trips, amount: a.amount + r.amount, miss: a.miss + r.miss }), { trips: 0, amount: 0, miss: 0 });
  return officeShell('agg', `<h1 class="h1">集計（SCR-33）</h1><p class="sub">請求書を作る前でも、記入された便からその場で計算します（金額は税抜・11 計算仕様書 6章）</p>

    <p style="font-size:11px;margin-top:14px">${esc(st.invoiceNote)}</p></div>`;
}

  if (f.startsWith('invdate.')) { const i = by(S.invoices, S.ui.invId); i[f.slice(8)] = v; i.version++; audit('INVOICE_DATES', 'invoice', i.invoiceNo, `請求書 ${i.invoiceNo} の${f.endsWith('issueDate') ? '請求日' : '入金期日'}を ${v} に変更`); return rerender(); }
  if (f === 'fpmap') { const b = bp(el.dataset.id); const p = S.fr.partners.find((x) => x.id === Number(v)); Object.assign(b, { freeePartnerId: p ? p.id : null, freeePartnerName: p ? p.name : null, freeeStatus: p ? 'MANUAL' : 'UNMAPPED' }); audit('FREEE_PARTNER_MAP', 'freee', b.id, `請求先「${b.name}」を freee の取引先「${p ? p.name : '（なし）'}」に対応付け`); S.fr.regs.forEach(judgeReg); return rerender(); }
  if (f === 'fim') { const it = item(el.dataset.id); it[el.dataset.k] = v === '' ? null : Number(v); audit('FREEE_ITEM_MAP', 'freee', it.id, `品目「${it.priceItemName}」の freee の対応付けを変更`); S.fr.regs.forEach(judgeReg); return rerender(); }
  if (f.startsWith('me.')) { const k = f.slice(3); S.ui.dlg.rec[k] = ['mailTo', 'mailCc'].includes(k) ? v.split(/[,、\s]+/).filter(Boolean) : v; return; }
  if (f === 'inactive') { S.ui.inactive = v; return rerender(); }
  if (f === 'ptId') { S.ui.ptId = v; return rerender(); }
  if (f === 'pe') return;
  if (f.startsWith('mk.')) { const m = mark(el.dataset.id); m[f.slice(3)] = v; return rerender(); }
  if (f.startsWith('nr.')) { (S.ui.nr ||= {})[f.slice(3)] = v; return; }
  if (f === 'pair') { const u = user(el.dataset.id); u.pairedTerminalId = v; audit('USER_UPDATE', 'user', u.id, `${u.name} の対のサイン端末を ${user(v).name} に変更`); return rerender(); }
  if (f === 'auf') { S.ui.auf = v; return rerender(); }
  if (f.startsWith('st.')) { const k = f.slice(3); M().settings[k] = ['reportFirstHour', 'reportLastHour'].includes(k) ? Number(v) : v; audit('SETTINGS_UPDATE', 'settings', k, `設定「${k}」を変更`); return el.tagName === 'SELECT' || el.type === 'checkbox' ? rerender() : save(); }
}
function rerenderKeep(el) { const f = el.dataset.f, pos = el.selectionStart; rerender(); const n = $(`[data-f="${f}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* 入力の種類による */ } } }

A.fwfull = () => { S.flowMode = false; const w = $('#fw'); if (w) w.remove(); rerender(); };
A.flowback = () => A.fwfull();
A.flowgo = (el) => {
  const n = el.dataset.n; if (S.flowMode) { S.fw ||= fwDefault(); S.fw.open = true; }
  const kind = FLOW_NODES[n][3]; S.ui = { showTab: true };
  if (n === 'SCR-01') { S.userId = null; return go({ name: 'login' }); }
  S.userId = kind === 'r' ? 'u_rcp' : kind === 't' ? 'u_tab' : kind === 'a' || kind === 'f' ? 'u_adm' : kind === 'o' ? 'u_off' : S.userId || 'u_rcp';
  if (S.today === '2026-02-05' && ['o', 'f', 'a'].includes(kind) && ['SCR-34', 'SCR-35', 'SCR-36', 'SCR-40', 'SCR-44'].includes(n)) { prepareFeb({ send: n !== 'SCR-34' && n !== 'SCR-36' }); }
  if (['SCR-11', 'SCR-12', 'SCR-13', 'SCR-14'].includes(n)) { S.ui.date = S.today; go({ name: 'rcp' }); if (n === 'SCR-11') A.rowadd(); if (n === 'SCR-13') A.print(); if (n === 'SCR-14') A.slipnew({ dataset: {} }); if (n === 'SCR-12') { const c = document.querySelector('.chip'); if (c) A.chip(c, { stopPropagation() {} }); } return; }
  if (['SCR-21', 'SCR-22'].includes(n)) { let sl = terminalSlip('u_tab'); if (!sl) { const g = unslipped(S.today)[0] || unslipped('2026-02-05')[0]; if (g) { sl = createSlip(S.today, g.customerId, g.siteId, g.trips, null, null, 'u_rcp'); sl.status = 'AWAITING_SIGNATURE'; sl.terminalId = 'u_tab'; } } if (n === 'SCR-22' && sl) { sl.status = 'SIGNED'; sl.signature = demoSig(sl.slipNo); sl.signedAt = `${S.today}T${S.time}:00+09:00`; sl.terminalId = null; S.ui.tabDone = 'u_tab'; } return go({ name: 'term' }, true); }
  if (n === 'SCR-20') { S.slips.filter((s) => s.terminalId === 'u_tab' && s.status === 'AWAITING_SIGNATURE').forEach((s) => { s.status = 'DRAFT'; s.terminalId = null; }); return go({ name: 'term' }); }
  if (n === 'SCR-35' || n === 'SCR-36') { const i = S.invoices.find((x) => x.status === 'DRAFT') || S.invoices[0]; if (i) { if (n === 'SCR-36') i.status = 'CONFIRMED'; S.ui.invId = i.id; } go({ name: n === 'SCR-35' ? 'inv' : 'bill' }); if (n === 'SCR-36' && i) { S.ui.bl = { month: i.periodTo.slice(0, 7), q: {} }; A.mailone({ dataset: { id: i.id } }); } return; }
  go(ROUTE_OF[n]);
};
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest?.('g[data-a="flowgo"]')) { e.preventDefault(); A.flowgo(e.target.closest('g')); } if (e.key === 'Escape') { if (S.ui.pop) A.popclose(); else if (S.ui.dlg) A.dlgclose(); } });

/* ---------------- 左の欄 ---------------- */
function sideNormal() {
  const cur = nodeOf(); const next = FLOW_EDGES.filter((e) => e[0] === cur).map((e) => `<li class="nv"><small>${e[1]}</small><span>${esc(FLOW_NODES[e[1]][2])}${e[2] ? `<br><span style="color:var(--mk-muted);font-size:11.5px">画面の「${esc(e[2])}」</span>` : ''}</span></li>`).join('');
  const trail = (S.trail || []).slice(-12).map((k) => `<li class="nv"><small>${k}</small><span>${esc(FLOW_NODES[k]?.[2] || '')}</span></li>`).join('');
  return `<p style="color:var(--mk-ink);margin-top:0">本番と同じように、画面の中のボタンで操作します。この欄は、いまの位置と次に進める画面の案内です。</p><h2>いまの画面</h2><p style="color:var(--mk-ink);font-size:14px"><b>${cur ? `${cur} ${esc(FLOW_NODES[cur][2])}` : '—'}</b></p><p>利用者：${me() ? esc(me().name) : 'ログインしていません'}</p><h2>この画面から進める画面</h2><ul>${next || '<li class="nv">画面の中のボタン・メニューで移動します</li>'}</ul><h2>これまでに通った画面</h2><ol>${trail || '<li class="nv">まだありません</li>'}</ol>${trail ? '<button class="mk-btn" data-a="trailclear" style="margin-top:6px">道筋を消す</button>' : ''}`;
}
function renderSide() {
  const tab = S.sideTab || 'scenario';
  const tabs = [['normal', '通常の操作'], ['scenario', 'シナリオ'], ['list', '画面一覧']].map(([k, t]) => `<button class="mk-btn" data-a="sidetab" data-k="${k}" aria-pressed="${tab === k}" style="flex:1;font-size:12px;padding:5px 3px;justify-content:center">${t}</button>`).join('');
  const cur = nodeOf();
  const body = tab === 'normal' ? sideNormal() : tab === 'scenario'
    ? `<h2>5分で分かる業務の流れ</h2><p>①〜⑤の順にご覧ください。最後の「確認」にご意見をください。</p><ol>${STORIES.map((s, i) => `<li><button data-a="story" data-i="${i}"><span><b>${esc(s.t)}</b><br><span style="color:var(--mk-muted);font-size:12px">${esc(s.d)}</span><br><span style="font-size:12px;color:var(--mk-accent)">確認：${esc(s.q)}</span></span></button></li>`).join('')}</ol><h2>ご要望・ご質問ごとの場面</h2><ol>${SCENARIOS.map((s, i) => `<li><button data-a="scenario" data-i="${i}"><small>${i + 1}</small><span><b>${esc(s.t)}</b><br><span style="color:var(--mk-muted);font-size:12px">${esc(s.d)}</span></span></button></li>`).join('')}</ol>`
    : `<ul>${Object.entries(FLOW_NODES).map(([k, n]) => `<li><button data-a="flowgo" data-n="${k}" ${cur === k ? 'aria-current="page"' : ''}><small>${k}</small>${esc(n[2])}</button></li>`).join('')}</ul><button class="mk-btn" data-a="flowmap" style="margin-top:8px;width:100%;justify-content:center">画面遷移図を開く</button>`;
  $('#mk-side').innerHTML = `<div style="display:flex;gap:4px;margin-bottom:10px">${tabs}</div>${body}<p style="margin-top:14px">データはこのブラウザの中だけに保存します。「初期データに戻す」で元に戻ります。</p>`;
  $('#mk-user').innerHTML = `<option value="">（ログアウト）</option>` + M().users.map((u) => `<option value="${u.id}" ${u.id === S.userId ? 'selected' : ''}>${esc(u.name)}（${ROLE_JA[u.role]}）</option>`).join('');
  $('#mk-date').value = S.today; const ts = []; for (let m = 6 * 60; m <= 20 * 60; m += 5) ts.push(tStr(m)); if (!ts.includes(S.time)) ts.push(S.time); ts.sort();
  $('#mk-time').innerHTML = ts.map((t) => `<option ${t === S.time ? 'selected' : ''}>${t}</option>`).join('');
  $('#mk-memo').setAttribute('aria-pressed', S.memo ? 'true' : 'false');
}

/* ---------------- 描画 ---------------- */
function render() {
  if (!me() && S.route.name !== 'login') S.route = { name: 'login' };
  if (me() && !canSee(S.route.name)) S.route = homeOf(role());
  renderSide();
  let inner; try { inner = VIEWS[S.route.name](); } catch (e) { console.error(e); inner = `<div class="vp"><p class="err">表示できませんでした：${esc(e.message)}</p></div>`; }
  const r = S.route.name; const isTab = r === 'term';
  const tabSlip = !isTab && ['rcp', 'sliplist'].includes(r) ? S.slips.find((s) => s.status === 'AWAITING_SIGNATURE') : null;
  const showTab = !isTab && ['rcp', 'sliplist'].includes(r) && (tabSlip || S.ui.tabDone) && S.ui.showTab !== false;
  const tid = tabSlip?.terminalId || S.ui.tabDone || 'u_tab';
  const pc = `<div class="dev pc"><div class="screen">${inner}</div><p class="devcap">${r === 'login' ? 'ログイン画面' : ['rcp', 'sliplist'].includes(r) ? '受付PC（Windows・Chrome / Edge）' : '本社PC（Windows・Chrome / Edge）'}</p></div>`;
  const tab = (h) => `<div class="dev tab"><div class="screen">${h}</div><p class="devcap" style="color:#bbb">サイン用タブレット（10〜11インチ・縦）</p></div>`;
  const dev = isTab ? `<div class="devs">${tab(inner)}</div>` : `<div class="devs">${pc}${showTab ? tab(tabletView(tid)) : ''}</div>`;
  if (S.flowMode) { const n = nodeOf(); return renderFlow(dev, n ? `${n} ${FLOW_NODES[n][2]}　／ ${me() ? me().name : 'ログイン前'}` : '画面'); }
  { const w = $('#fw'); if (w) w.remove(); }
  $('#app').innerHTML = `<div class="mk-stage ${S.memo ? '' : 'nomemo'}"><div>${dev}</div>${S.memo ? memoHTML() : ''}</div>`;
  afterRender();
}
/* サインの枠（描画のたびに線を描き直し、ポインタで書けるようにする） */
function afterRender() {
  $$('canvas.sign').forEach((cv) => {
    const sid = cv.dataset.sig; if (!S.ui.sig || S.ui.sig.slip !== sid) S.ui.sig = { slip: sid, strokes: [] };
    const ctx = cv.getContext('2d'); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#112233';
    const draw = () => { ctx.clearRect(0, 0, cv.width, cv.height); ctx.strokeStyle = '#d0d4dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(30, cv.height - 50); ctx.lineTo(cv.width - 30, cv.height - 50); ctx.stroke(); ctx.strokeStyle = '#112233'; ctx.lineWidth = 5; S.ui.sig.strokes.forEach((s) => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); }); };
    draw(); let cur = null;
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * cv.width, ((e.clientY - r.top) / r.height) * cv.height]; };
    cv.onpointerdown = (e) => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; S.ui.sig.strokes.push(cur); };
    cv.onpointermove = (e) => { if (!cur) return; cur.push(pt(e)); draw(); };
    cv.onpointerup = () => { if (!cur) return; cur = null; const b = $(`[data-a="sigok"][data-id="${sid}"]`); if (b) b.disabled = false; save(); };
  });
}

/* ---------------- イベント ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) { if (S.ui.pop && !e.target.closest('.pop')) A.popclose(); return; }
  const a = el.dataset.a; if (el.tagName === 'INPUT' && el.type === 'checkbox' && !['sel', 'invsel', 'invselall', 'fsel', 'fselall', 'demomail', 'demofail'].includes(a)) return;
  if (el.tagName === 'INPUT' && el.type === 'radio') return A[a]?.(el, e);
  if (A[a]) { if (a !== 'ovclose') e.preventDefault?.(); A[a](el, e); }
});
document.addEventListener('contextmenu', (e) => { const td = e.target.closest('td.hc'); if (!td) return; e.preventDefault(); S.ui.pop = { kind: 'cell', row: td.dataset.row, h: Number(td.dataset.h), ...popPos(td) }; rerender(); });
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset.f) onField(el); });
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset.f && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'date', 'time', 'file', 'color'].includes(el.type)))) { if (['rf.vehicleNo'].includes(el.dataset.f) || el.dataset.f.startsWith('bl.q.') || el.dataset.f.startsWith('me.') || el.dataset.f === 'reasonText' || el.dataset.f.startsWith('sf.') || el.dataset.f.startsWith('st.')) onField(el); } });

/* 外枠の操作パネル */
$('#mk-user').addEventListener('change', (e) => { S.userId = e.target.value || null; S.ui = { showTab: true }; S.flowMode && (S.fw.open = true); go(me() ? homeOf(role()) : { name: 'login' }); });
$('#mk-date').addEventListener('change', (e) => { if (!e.target.value) return; S.today = e.target.value; S.ui.date = S.today; rerender(); });
$('#mk-time').addEventListener('change', (e) => { S.time = e.target.value; rerender(); });
document.querySelectorAll('[data-mk]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.mk;
  if (k === 'reset') { if (!confirm('初期データに戻しますか？（この試作で入力した内容は消えます）')) return; freshState(); S.fw = fwDefault(); go({ name: 'login' }); return; }
  if (k === 'memo') { S.memo = !S.memo; return rerender(); }
  const add = { 't+5': 5, 't+15': 15, 't+60': 60 }[k]; if (add) { S.time = tStr(Math.min(toMin(S.time) + add, 23 * 60 + 55)); rerender(); toast(`試作の時刻：${S.time}`); } }));

/* 説明資料からのリンク（#flow・#start・#story-1・#scenario-3・#reset） */
function openHash() {
  const h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  if (h === 'flow') return A.flowmap();
  if (h === 'start') { S.flowMode = false; S.userId = null; S.ui = {}; S.sideTab = 'normal'; S.trail = []; return go({ name: 'login' }); }
  if (h === 'reset') { freshState(); S.fw = fwDefault(); return go({ name: 'login' }); }
  let m = h.match(/^story-(\d)$/); if (m && STORIES[m[1] - 1]) { S.sideTab = 'scenario'; return STORIES[m[1] - 1].run(); }
  m = h.match(/^scenario-(\d+)$/); if (m && SCENARIOS[m[1] - 1]) { S.sideTab = 'scenario'; return SCENARIOS[m[1] - 1].run(); }
  m = h.match(/^(SCR-\d\d)$/); if (m && FLOW_NODES[m[1]]) return A.flowgo({ dataset: { n: m[1] } });
}
addEventListener('hashchange', openHash);
load(); S.fw ||= fwDefault(); S.trail ||= []; render(); openHash();


</script>
