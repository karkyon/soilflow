      x-roles: [ADMIN]
      responses:
        '200': { description: 照合の結果, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PartnerMapping' } } } } }
  /billing-parties/{id}/freee-partner:
    put:
      tags: [freee]
      operationId: setPartnerMapping
      summary: 取引先を選び直す（null で外す）
      x-roles: [ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [freeePartnerId], properties: { freeePartnerId: { type: [integer, 'null'] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerMapping' } } } }
  /freee/account-items:
    get:
      tags: [freee]
      operationId: listFreeeAccountItems
      summary: 勘定科目（収入のもの）
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } } } } }
  /freee/taxes:
    get:
      tags: [freee]
      operationId: listFreeeTaxes
      summary: 税区分（事業所で使えるもの。GET /api/1/taxes/companies/{company_id}）
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } } } } }
  /freee/items:
    get:
      tags: [freee]
      operationId: listFreeeItems
      summary: freee の品目
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } } } } }
  /items/{id}/freee-mapping:
    put:
      tags: [freee]
