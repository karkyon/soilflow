      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PartnerMapping' } } } } }
  /freee/partner-mappings/auto-match:
    post:
      tags: [freee]
      operationId: autoMatchPartners
