openapi: 3.1.0
info:
  title: SoilFlow API
  version: 1.0.0
  description: |
    SoilFlow 受入・請求管理システムの API 契約の正本（08 API設計書）。
    - ベースパス `/api/v1`。画面と同じドメイン（Firebase Hosting から Cloud Run へ転送）。
    - 認証は Cookie `__session`（HttpOnly・Secure・SameSite=Lax）。更新系は `X-CSRF-Token` ヘッダが必須。
    - 日付は `YYYY-MM-DD`、時刻は `HH:MM`、日時は ISO 8601（+09:00）。金額は整数（円）。
    - 更新系で同時更新を検出する対象は `version` を送る。合わなければ 409 `CONFLICT`。
    - 各操作の `x-roles` は呼び出せる利用者区分（RECEPTION・SIGN_TERMINAL・OFFICE・ADMIN）。
servers:
  - url: /api/v1
tags:
  - { name: auth, description: ログイン・セッション }
  - { name: reports, description: 受入日報・行・便（FR-RCV） }
  - { name: slips, description: 伝票（FR-SLP） }
  - { name: terminal, description: サイン端末（FR-SGN） }
  - { name: aggregates, description: 集計・状況（FR-AGG） }
  - { name: billing, description: 締め・請求書（FR-BIL） }
  - { name: mail, description: メール送信（FR-MAL） }
  - { name: freee, description: freee会計連携（FR-FRE） }
  - { name: masters, description: マスタ（FR-MST） }
  - { name: admin, description: 利用者・操作履歴・設定（FR-CMN） }
  - { name: internal, description: Cloud Scheduler からの呼び出し }
security:
  - session: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン（FR-CMN-01）
      security: []
      x-roles: [ANY]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string, maxLength: 40 }
                password: { type: string, maxLength: 200 }
      responses:
        '200':
          description: ログイン成功。2段階の確認が必要なら mfaRequired=true（Cookie は仮のセッション）
          headers:
            Set-Cookie: { schema: { type: string }, description: '__session=…; HttpOnly; Secure; SameSite=Lax; Path=/' }
          content:
            application/json:
              schema:
                type: object
                required: [mfaRequired]
                properties:
                  mfaRequired: { type: boolean }
                  me: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: 5回続けて失敗したため15分ロック（ACCOUNT_LOCKED）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: 2段階の確認コードの確認（管理者、NFR-12）
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } }
      responses:
        '200': { description: 確認済み, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      x-roles: [ANY]
      responses:
        '204': { description: ログアウトした }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の利用者と CSRF トークン
      x-roles: [ANY]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 自分のパスワードの変更（12文字以上）
      x-roles: [ANY]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [current, next], properties: { current: { type: string }, next: { type: string, minLength: 12 } } } } }
      responses:
        '204': { description: 変更した }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ reports
  /daily-reports/{date}:
    get:
      tags: [reports]
      operationId: getDailyReport
      summary: 日報（行・便・台数）。なければ作る（FR-RCV-01・02・16）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Date' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DailyReport' } } } }
  /daily-reports/{date}/changes:
    get:
      tags: [reports]
      operationId: getDailyReportChanges
      summary: 前回のカーソル以降に変わった行・便（FR-RCV-17、04 3.3）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Date' }
        - { name: since, in: query, required: true, schema: { type: string }, description: 前回の応答の cursor }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [cursor, rows, trips, counts]
                properties:
                  cursor: { type: string }
                  rows: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }
                  trips: { type: array, items: { $ref: '#/components/schemas/Trip' } }
                  counts: { $ref: '#/components/schemas/TripCounts' }
  /daily-reports/{date}/carry-over:
    get:
      tags: [reports]
      operationId: getCarryOverCandidates
      summary: 前の営業日に便があった行の一覧（FR-RCV-06）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Date' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { fromDate: { type: string, format: date }, rows: { type: array, items: { $ref: '#/components/schemas/ReportRow' } } } } } } }
    post:
      tags: [reports]
      operationId: carryOver
      summary: 選んだ行を引き継ぐ
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Date' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [rowIds], properties: { rowIds: { type: array, items: { type: string, format: uuid }, minItems: 1 } } } } }
      responses:
        '201': { description: 作った行, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReportRow' } } } } }
  /daily-reports/{date}/pdf:
    get:
      tags: [reports]
      operationId: getDailyReportPdf
      summary: 日報の PDF（RPT-01）の署名付き URL
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Date' } ]
      responses:
        '200': { $ref: '#/components/responses/FileUrl' }
  /report-rows:
    post:
      tags: [reports]
      operationId: createReportRow
      summary: 行の追加・車番の追加（FR-RCV-04・05）。新しい車番は vehicleNo で送ると車番マスタに登録する
      x-roles: [RECEPTION, OFFICE, ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReportRowInput' } } }
      responses:
        '201': { description: 作った行, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRow' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /report-rows/{id}:
    patch:
      tags: [reports]
      operationId: updateReportRow
      summary: 行の修正（FR-RCV-15）。ロックされていない便の品目を計算し直す
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReportRowInput'
                - type: object
                  required: [version]
                  properties: { version: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReportRow' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [reports]
      operationId: deleteReportRow
      summary: 行の削除（有効な便がある行は不可）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: 削除した }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /trips:
    post:
      tags: [reports]
      operationId: createTrips
      summary: 便の記入（1行または車列）（FR-RCV-07・08・12）
      description: |
        `rowIds` が2件以上なら同じ時刻で車列として記入する。`time` を省くとサーバーで現在時刻を使う（PC の時刻との差が5分以内なら clientTime を使う）。
        `clientOpId` が保存済みなら 200 で保存済みの便を返す（二重保存しない）。
      x-roles: [RECEPTION, OFFICE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, rowIds, clientOpId]
              properties:
                date: { type: string, format: date }
                rowIds: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 30 }
                time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: 過去の時間帯に記入するとき（FR-RCV-08） }
                clientTime: { type: string, format: date-time, description: クリックした瞬間の PC の時刻 }
                clientOpId: { type: string, format: uuid }
      responses:
        '200': { description: 保存済み（同じ clientOpId）, content: { application/json: { schema: { $ref: '#/components/schemas/TripsCreated' } } } }
        '201': { description: 作った便, content: { application/json: { schema: { $ref: '#/components/schemas/TripsCreated' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /trips/{id}:
    patch:
      tags: [reports]
      operationId: updateTrip
      summary: 便の時刻・印の変更（FR-RCV-10・13）。applyToConvoy=true で車列の全部の便に同じ印
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                markId: { type: [string, 'null'], format: uuid }
                applyToConvoy: { type: boolean, default: true }
      responses:
        '200': { description: 変わった便（車列を含む）, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Trip' } } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /trips/{id}/cancel:
    post:
      tags: [reports]
      operationId: cancelTrip
      summary: 便の取消（記録は残る）（FR-RCV-13）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer }, reason: { type: string, maxLength: 200 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Trip' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ slips
  /slips:
    get:
      tags: [slips]
      operationId: listSlips
      summary: 伝票の一覧（受付は当日、本社は期間）（FR-SLP-12）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SlipStatus' } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string }, description: 変わった伝票だけ（サイン完了の通知用） }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Slip' } }
                  unslipped: { type: array, description: 伝票未発行の便がある客先・現場, items: { type: object, properties: { customerId: { type: string, format: uuid }, customerName: { type: string }, siteId: { type: [string, 'null'], format: uuid }, siteName: { type: [string, 'null'] }, tripCount: { type: integer } } } }
                  cursor: { type: string }
    post:
      tags: [slips]
      operationId: createSlip
      summary: 伝票の発行（FR-SLP-01〜04）。tripIds を省くとその客先・現場の未発行の便すべて
      x-roles: [RECEPTION, OFFICE, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, customerId]
              properties:
                date: { type: string, format: date }
                customerId: { type: string, format: uuid }
                siteId: { type: [string, 'null'], format: uuid }
                tripIds: { type: array, items: { type: string, format: uuid } }
                billingPartyId: { type: string, format: uuid, description: 既定と違う請求先にするとき }
                billingChangeReason: { type: string, maxLength: 200 }
      responses:
        '201': { description: 作った伝票, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /slips/{id}:
    get:
      tags: [slips]
      operationId: getSlip
      summary: 伝票の詳細
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
    patch:
      tags: [slips]
      operationId: updateSlipBillingParty
      summary: 請求先の変更（DRAFT・AWAITING_SIGNATURE のとき）（FR-SLP-04）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version, billingPartyId], properties: { version: { type: integer }, billingPartyId: { type: string, format: uuid }, billingChangeReason: { type: string, maxLength: 200 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /slips/{id}/send-to-terminal:
    post:
      tags: [slips]
      operationId: sendSlipToTerminal
      summary: サイン用タブレットへ送る（FR-SLP-05）。terminalId を省くと利用者の対の端末
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { terminalId: { type: string, format: uuid } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
        '409': { description: その端末に別のサイン待ちがある（TERMINAL_BUSY）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /slips/{id}/withdraw:
    post:
      tags: [slips]
      operationId: withdrawSlip
      summary: タブレットへの送信を取りやめる（FR-SGN-05）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
  /slips/{id}/print-paper:
    post:
      tags: [slips]
      operationId: printPaperSlip
      summary: 紙伝票（サイン欄が空、RPT-04）に切り替えて印刷用の URL を返す（FR-SLP-11）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/FileUrl' }
  /slips/{id}/paper-scan:
    post:
      tags: [slips]
      operationId: registerPaperScan
      summary: 紙伝票のスキャン PDF を登録（FR-SLP-11）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, contentMediaType: application/pdf, description: 20MB まで } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /slips/{id}/cancel:
    post:
      tags: [slips]
      operationId: cancelSlip
      summary: 伝票の取消（理由必須）（FR-SLP-10）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Slip' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /slips/{id}/pdf:
    get:
      tags: [slips]
      operationId: getSlipPdf
      summary: 伝票の PDF（サイン入り RPT-02/03、紙伝票のスキャン）
      x-roles: [RECEPTION, OFFICE, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: kind, in: query, schema: { type: string, enum: [signed, office, scan, paper], default: signed }, description: 'signed＝お客さま控え（RPT-02）、office＝フジモト様控え（RPT-03）、scan＝紙伝票のスキャン、paper＝紙伝票（RPT-04）' }
      responses:
        '200': { $ref: '#/components/responses/FileUrl' }

  # ------------------------------------------------------------------ terminal
  /terminal/current-slip:
    get:
      tags: [terminal]
      operationId: getCurrentSlip
      summary: この端末に表示する伝票（なければ null）（FR-SGN-01）
      x-roles: [SIGN_TERMINAL]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { slip: { oneOf: [ { $ref: '#/components/schemas/TerminalSlip' }, { type: 'null' } ] } } } } } }
  /terminal/slips/{id}/sign:
    post:
      tags: [terminal]
      operationId: signSlip
      summary: サインの確定（FR-SGN-04）
      x-roles: [SIGN_TERMINAL]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signaturePng, strokeCount]
              properties:
                signaturePng: { type: string, contentEncoding: base64, description: 'PNG（1200×400 まで、200KB まで）' }
                strokeCount: { type: integer, minimum: 1 }
                signerName: { type: string, maxLength: 40 }
      responses:
        '200': { description: サイン済, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalSlip' } } } }
        '409': { description: すでにサイン済・取りやめ済（SLIP_NOT_AWAITING）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------------------ aggregates
  /dashboard:
    get:
      tags: [aggregates]
      operationId: getDashboard
      summary: 本社の状況（FR-AGG-01）
      x-roles: [OFFICE, ADMIN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: object, properties: { date: { type: string, format: date }, tripCount: { type: integer }, awaitingSignature: { type: integer }, unslippedTrips: { type: integer } } }
                  invoices: { type: object, additionalProperties: { type: integer }, description: 状態ごとの件数 }
                  freee: { type: object, properties: { connection: { $ref: '#/components/schemas/FreeeConnectionStatus' }, counts: { type: object, additionalProperties: { type: integer } } } }
                  alerts: { type: array, items: { type: object, properties: { code: { type: string }, message: { type: string }, link: { type: string } } } }
  /aggregates:
    get:
      tags: [aggregates]
      operationId: getAggregates
      summary: 集計（FR-AGG-03、11 6章）
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: groupBy, in: query, required: true, schema: { type: array, items: { type: string, enum: [date, customer, site, billingParty, item, vehicleClass] }, maxItems: 3 }, style: form, explode: false }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: billingPartyId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object, properties: { keys: { type: object, additionalProperties: { type: string } }, labels: { type: object, additionalProperties: { type: string } }, tripCount: { type: integer }, amount: { type: integer }, priceMissingCount: { type: integer } } } }
                  total: { type: object, properties: { tripCount: { type: integer }, amount: { type: integer }, priceMissingCount: { type: integer } } }
  /aggregates/trips:
    get:
      tags: [aggregates]
      operationId: getAggregateTrips
      summary: 集計の1行に入った便（FR-AGG-04）
      description: |
        集計の行の `keys` をそのまま渡すと、その行に入った便を返す（日報・伝票・サイン・請求書へたどる）。現場なし・請求先なしは空文字。2,000件まで。
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: billingPartyId, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: customer, in: query, schema: { type: string, format: uuid } }
        - { name: site, in: query, schema: { type: string } }
        - { name: billingParty, in: query, schema: { type: string } }
        - { name: item, in: query, schema: { type: string, format: uuid } }
        - { name: vehicleClass, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, truncated, items]
                properties:
                  total: { type: integer }
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        date: { type: string, format: date }
                        time: { type: string }
                        customerName: { type: string }
                        siteName: { type: string, nullable: true }
                        vehicleNo: { type: string }
                        itemName: { type: string }
                        vehicleClassName: { type: string }
                        markSymbol: { type: string, nullable: true }
                        unitPrice: { type: integer, nullable: true }
                        billingPartyName: { type: string, nullable: true }
                        slipId: { type: string, format: uuid, nullable: true }
                        slipNo: { type: string, nullable: true }
                        slipStatus: { type: string, nullable: true }
                        hasScan: { type: boolean }
                        invoiceId: { type: string, format: uuid, nullable: true }
                        invoiceNo: { type: string, nullable: true }
  /aggregates/export:
    get:
      tags: [aggregates]
      operationId: exportAggregates
      summary: 集計の出力（CSV・Excel）（FR-AGG-05）
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx] } }
      responses:
        '200': { $ref: '#/components/responses/FileUrl' }

  # ------------------------------------------------------------------ billing
  /billing/precheck:
    get:
      tags: [billing]
      operationId: billingPrecheck
      summary: 締めの前の確認（FR-BIL-04）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Month' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  billingParties: { type: array, items: { type: object, properties: { billingPartyId: { type: string, format: uuid }, name: { type: string }, periodFrom: { type: string, format: date }, periodTo: { type: string, format: date }, tripCount: { type: integer }, subtotal: { type: integer }, existingInvoiceId: { type: [string, 'null'], format: uuid } } } }
                  problems: { type: array, items: { $ref: '#/components/schemas/BillingProblem' } }
  /billing/runs:
    post:
      tags: [billing]
      operationId: runBilling
      summary: 締め（請求書の自動作成）（FR-BIL-03）。50件を超えるときは 202 でジョブにする
      x-roles: [OFFICE, ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [month], properties: { month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, billingPartyIds: { type: array, items: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: 締めの結果, content: { application/json: { schema: { $ref: '#/components/schemas/BillingRun' } } } }
        '202': { description: ジョブで実行中, content: { application/json: { schema: { $ref: '#/components/schemas/BillingRun' } } } }
  /billing/runs/{id}:
    get:
      tags: [billing]
      operationId: getBillingRun
      summary: 締めの結果（進み具合）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BillingRun' } } } }
  /invoices:
    get:
      tags: [billing]
      operationId: listInvoices
      summary: 請求書の一覧・検索（請求日・金額の範囲・請求先の組合せ、02 6.3）
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: month, in: query, schema: { type: string } }
        - { name: issueFrom, in: query, schema: { type: string, format: date } }
        - { name: issueTo, in: query, schema: { type: string, format: date } }
        - { name: amountMin, in: query, schema: { type: integer } }
        - { name: amountMax, in: query, schema: { type: integer } }
        - { name: billingPartyId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/InvoiceStatus' } }, style: form, explode: false }
        - { name: includeVoided, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } } } } } } }
  /invoices/{id}:
    get:
      tags: [billing]
      operationId: getInvoice
      summary: 請求書の詳細（明細・元の便・伝票へのリンク）（FR-BIL-10）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
    patch:
      tags: [billing]
      operationId: updateInvoiceDates
      summary: 請求日・入金期日の変更（送信前だけ）（FR-BIL-08）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer }, issueDate: { type: string, format: date }, dueDate: { type: string, format: date } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /invoices/{id}/rebuild:
    post:
      tags: [billing]
      operationId: rebuildInvoice
      summary: 作り直す（FR-BIL-11）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionOnly' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /invoices/{id}/confirm:
    post:
      tags: [billing]
      operationId: confirmInvoice
      summary: 確認済にする（FR-BIL-10）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionOnly' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}/unconfirm:
    post:
      tags: [billing]
      operationId: unconfirmInvoice
      summary: 確認を取り消す
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionOnly' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
  /invoices/{id}/void:
    post:
      tags: [billing]
      operationId: voidInvoice
      summary: 取消（理由必須）。freee 登録済なら取引の削除を予約（FR-BIL-13、FR-FRE-18）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /invoices/{id}/reissue:
    post:
      tags: [billing]
      operationId: reissueInvoice
      summary: 取消して再発行（FR-BIL-13、FR-FRE-19）。新しい請求書（DRAFT）を返す
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } } }
      responses:
        '201': { description: 新しい請求書, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /invoices/{id}/pdf:
    get:
      tags: [billing]
      operationId: getInvoicePdf
      summary: 請求書 PDF（RPT-05）の署名付き URL
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/FileUrl' }

  # ------------------------------------------------------------------ mail
  /invoices/mail-preview:
    post:
      tags: [mail]
      operationId: previewInvoiceMail
      summary: 送信前の確認（宛先・件名・本文・添付・freee の警告）（FR-MAL-02、FR-FRE-22）
      x-roles: [OFFICE, ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [invoiceIds], properties: { invoiceIds: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 100 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MailPreview' } } } } } } }
  /invoices/send:
    post:
      tags: [mail]
      operationId: sendInvoices
      summary: 確認済の請求書をメール送信（FR-MAL-02）
      x-roles: [OFFICE, ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [invoiceIds], properties: { invoiceIds: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 100 } } } } }
      responses:
        '200': { description: 請求書ごとの結果, content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { type: object, properties: { invoiceId: { type: string, format: uuid }, status: { $ref: '#/components/schemas/InvoiceStatus' }, error: { $ref: '#/components/schemas/Error' } } } } } } } } }
  /invoices/{id}/resend:
    post:
      tags: [mail]
      operationId: resendInvoice
      summary: 再送（FR-MAL-05）。宛先を変えて送れる
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { to: { type: array, items: { type: string, format: email } }, cc: { type: array, items: { type: string, format: email } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailLog' } } } }
  /invoices/{id}/mail-logs:
    get:
      tags: [mail]
      operationId: listMailLogs
      summary: 送信履歴（FR-MAL-04）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MailLog' } } } } }
  /webhooks/mail-events:
    post:
      tags: [mail]
      operationId: receiveMailEvents
      summary: メールサービスからの送信結果（不達など）（FR-MAL-06）。署名を検証する
      security: []
      x-roles: [EXTERNAL]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { type: object } } } } }
      responses:
        '204': { description: 受け付けた }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ freee
  /freee/connection:
    get:
      tags: [freee]
      operationId: getFreeeConnection
      summary: 連携の状態（FR-FRE-03）
      x-roles: [OFFICE, ADMIN]
      responses:
