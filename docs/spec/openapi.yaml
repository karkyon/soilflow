    patch:
      tags: [freee]
      operationId: updateFreeeConnection
      summary: 登録のしかた・事業所の選択（FR-FRE-02・09）
      x-roles: [ADMIN]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer }, registrationMode: { type: string, enum: [REVIEW, AUTO] }, companyId: { type: integer } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FreeeConnectionStatus' } } } }
    delete:
      tags: [freee]
      operationId: disconnectFreee
      summary: 連携の解除（鍵を消す）（FR-FRE-04）
      x-roles: [ADMIN]
      responses:
        '204': { description: 解除した }
  /freee/connection/authorize:
    post:
      tags: [freee]
      operationId: startFreeeAuthorization
      summary: 連携許可を始める。freee の認可画面の URL を返す（FR-FRE-01）
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [authorizeUrl], properties: { authorizeUrl: { type: string, format: uri } } } } } }
  /freee/oauth/callback:
    get:
      tags: [freee]
      operationId: freeeOAuthCallback
      summary: freee からの戻り先。state を確かめて鍵を受け取り、SCR-41 へ戻す
      x-roles: [ADMIN]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: '/office/freee/settings?result=ok|error へ戻す' }
  /freee/companies:
    get:
      tags: [freee]
      operationId: listFreeeCompanies
      summary: 選べる事業所（連携許可で事業所が決まらなかったとき）
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } } } } }
  /freee/partners:
    get:
      tags: [freee]
      operationId: listFreeePartners
      summary: freee の取引先（検索）
      x-roles: [ADMIN]
      parameters: [ { name: keyword, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } } } } }
    post:
      tags: [freee]
      operationId: createFreeePartner
      summary: 請求先から freee に取引先を作って対応付ける（FR-FRE-07）
      x-roles: [ADMIN]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [billingPartyId], properties: { billingPartyId: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PartnerMapping' } } } }
  /freee/partner-mappings:
    get:
      tags: [freee]
      operationId: listPartnerMappings
      summary: 請求先と取引先の対応付けの一覧（FR-FRE-06）
