      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FreeeRegistration' } } } }
  /freee/api-logs:
    get:
      tags: [freee]
      operationId: listFreeeApiLogs
      summary: freee 登録の履歴（FR-FRE-20）
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: registrationId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FreeeApiLog' } } } } }

