      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MasterRecord' } } } } }
    post:
      tags: [masters]
      operationId: createMaster
      summary: マスタの追加（客先を作ると同名の請求先も作る、11 3.4）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/MasterKind' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /masters/{kind}/{id}:
    patch:
      tags: [masters]
      operationId: updateMaster
      summary: マスタの変更・無効化（active=false）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/MasterKind' }, { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MasterRecord' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /masters/import:
    post:
      tags: [masters]
      operationId: importMasters
      summary: CSV の一括登録（客先・現場・請求先・車番）（FR-MST-10）。dryRun=true で確認だけ
      x-roles: [OFFICE, ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [kind, file], properties: { kind: { type: string, enum: [customers, sites, billingParties, vehicles] }, file: { type: string, contentMediaType: text/csv }, dryRun: { type: boolean } } }
      responses:
        '200': { description: 取込の結果, content: { application/json: { schema: { type: object, properties: { created: { type: integer }, updated: { type: integer }, errors: { type: array, items: { type: object, properties: { line: { type: integer }, message: { type: string } } } } } } } } }
  /price-tables:
    get:
      tags: [masters]
      operationId: listPriceTables
      summary: 単価表の一覧（参考値と違う金額の印つき）（FR-MST-07）
      x-roles: [OFFICE, ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PriceTable' } } } } }
    post:
      tags: [masters]
      operationId: createPriceTable
      summary: 新しい単価表（copyFrom の表を写して作る）
      x-roles: [OFFICE, ADMIN]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [effectiveFrom], properties: { effectiveFrom: { type: string, format: date }, copyFrom: { type: string, format: uuid }, note: { type: string } } } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PriceTable' } } } }
  /price-tables/{id}/entries:
    put:
      tags: [masters]
      operationId: putPriceEntries
      summary: 単価表の金額をまとめて保存（適用開始日が過ぎ、請求書に使われた表は変更不可）
      x-roles: [OFFICE, ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PriceEntry' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PriceTable' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ admin
  /users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: 利用者の一覧（FR-CMN-03）
      x-roles: [ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
    post:
      tags: [admin]
      operationId: createUser
      summary: 利用者の追加（仮のパスワードを返す。次回ログインで変更）
      x-roles: [ADMIN]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserInput' } } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' }, temporaryPassword: { type: string } } } } } }
  /users/{id}:
    patch:
      tags: [admin]
      operationId: updateUser
      summary: 区分・対の端末・有効の変更
      x-roles: [ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/UserInput' }, { type: object, required: [version], properties: { version: { type: integer } } } ] } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
  /users/{id}/reset-password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: パスワードの初期化（ロックも解除）
      x-roles: [ADMIN]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { temporaryPassword: { type: string } } } } } }
  /audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      summary: 操作履歴（FR-CMN-04）
      x-roles: [OFFICE, ADMIN]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }, total: { type: integer } } } } } }
  /settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: システム設定
      x-roles: [OFFICE, ADMIN]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    patch:
      tags: [admin]
      operationId: updateSettings
      summary: システム設定の変更（FR-CMN-05）
      x-roles: [ADMIN]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }

  # ------------------------------------------------------------------ internal
  /internal/jobs/run:
    post:
      tags: [internal]
      operationId: runJobs
      summary: ジョブの実行（Cloud Scheduler から毎分。Google の OIDC トークンを検証）
      security: [ { schedulerOidc: [] } ]
      x-roles: [SCHEDULER]
      responses:
        '200': { description: 実行した件数, content: { application/json: { schema: { type: object, properties: { done: { type: integer }, failed: { type: integer } } } } } }
  /healthz:
    get:
      tags: [internal]
      operationId: health
      summary: 稼働確認（DB への接続を含む）
      security: []
      x-roles: [ANY]
      responses:
        '200': { description: OK }
        '503': { description: DB に接続できない }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __session }
    schedulerOidc: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Date: { name: date, in: path, required: true, schema: { type: string, format: date } }
    Month: { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' } }
    MasterKind: { name: kind, in: path, required: true, schema: { type: string, enum: [customers, sites, billingParties, vehicles, items, vehicleClasses, marks] } }
  responses:
    BadRequest: { description: 入力の誤り（VALIDATION_ERROR）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: ログインしていない（UNAUTHENTICATED）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 他の人が先に変更した（CONFLICT）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: 業務の決まりに反する（08 3.2 のコード）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    FileUrl: { description: 署名付き URL（5分で失効）, content: { application/json: { schema: { type: object, required: [url, fileName], properties: { url: { type: string, format: uri }, fileName: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [TRIP_LOCKED_BY_SLIP] }
        message: { type: string }
        details: {}
        requestId: { type: string }
    VersionOnly: { type: object, required: [version], properties: { version: { type: integer } } }
    ReasonInput: { type: object, required: [version, reason], properties: { version: { type: integer }, reason: { type: string, minLength: 1, maxLength: 500 } } }
    Role: { type: string, enum: [RECEPTION, OFFICE, ADMIN, SIGN_TERMINAL] }
    Me:
      type: object
      required: [id, name, role, csrfToken]
      properties:
        id: { type: string, format: uuid }
        loginId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        pairedTerminalId: { type: [string, 'null'], format: uuid }
        mustChangePassword: { type: boolean }
        csrfToken: { type: string }
        reportHours: { type: object, properties: { first: { type: integer }, last: { type: integer } } }
        serverTime: { type: string, format: date-time }
    ReportRowInput:
      type: object
      required: [date, customerId, itemId, vehicleClassId]
      properties:
        date: { type: string, format: date }
        customerId: { type: string, format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        vehicleId: { type: string, format: uuid }
        vehicleNo: { type: string, maxLength: 20, description: 新しい車番のとき（vehicleId と排他） }
        itemId: { type: string, format: uuid }
        vehicleClassId: { type: string, format: uuid }
        afterRowId: { type: string, format: uuid, description: この行の下に入れる }
    ReportRow:
      type: object
      required: [id, customerId, customerName, vehicleId, vehicleNo, itemId, itemLabel, vehicleClassId, vehicleClassName, sortOrder, version]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        siteId: { type: [string, 'null'], format: uuid }
        siteName: { type: [string, 'null'] }
        vehicleId: { type: string, format: uuid }
        vehicleNo: { type: string }
        itemId: { type: string, format: uuid }
        itemLabel: { type: string, description: 日報表記 }
        vehicleClassId: { type: string, format: uuid }
        vehicleClassName: { type: string }
        sortOrder: { type: integer }
        deleted: { type: boolean }
        version: { type: integer }
    Trip:
      type: object
      required: [id, rowId, time, hourSlot, status, effectiveItemId, version]
      properties:
        id: { type: string, format: uuid }
        rowId: { type: string, format: uuid }
        time: { type: string, examples: ['11:24'] }
        hourSlot: { type: integer, description: 表示する列（11 2.2） }
        markId: { type: [string, 'null'], format: uuid }
        effectiveItemId: { type: string, format: uuid }
        convoyId: { type: [string, 'null'], format: uuid }
        slipId: { type: [string, 'null'], format: uuid }
        locked: { type: string, enum: [NONE, SLIP, INVOICE] }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        version: { type: integer }
    TripsCreated:
      type: object
      properties:
        trips: { type: array, items: { $ref: '#/components/schemas/Trip' } }
        clockSkewWarning: { type: boolean, description: PC の時計が5分以上ずれていた }
    TripCounts:
      type: object
      properties:
        byRow: { type: object, additionalProperties: { type: integer } }
        byCustomer: { type: object, additionalProperties: { type: integer } }
        total: { type: integer }
    DailyReport:
      type: object
      required: [date, rows, trips, counts, cursor, marks]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        firstHour: { type: integer }
        lastHour: { type: integer }
        rows: { type: array, items: { $ref: '#/components/schemas/ReportRow' } }
        trips: { type: array, items: { $ref: '#/components/schemas/Trip' } }
        counts: { $ref: '#/components/schemas/TripCounts' }
        marks: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, symbol: { type: string }, displayName: { type: string }, color: { type: string } } } }
        cursor: { type: string }
    SlipStatus: { type: string, enum: [DRAFT, AWAITING_SIGNATURE, SIGNED, PAPER_PRINTED, PAPER_SIGNED, CANCELLED] }
    SlipLine:
      type: object
      properties:
        lineNo: { type: integer }
        itemLabel: { type: string, examples: ['山土（真砂土30mm）10t'] }
        tripCount: { type: integer }
        vehicleNos: { type: string }
    Slip:
      type: object
      required: [id, slipNo, slipDate, status, addresseeName, billingPartyId, billingPartyName, lines, version]
      properties:
        id: { type: string, format: uuid }
        slipNo: { type: string }
        slipDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/SlipStatus' }
        customerId: { type: string, format: uuid }
        addresseeName: { type: string }
        siteId: { type: [string, 'null'], format: uuid }
        siteName: { type: [string, 'null'] }
        billingPartyId: { type: string, format: uuid }
        billingPartyName: { type: string }
        billingPartyChanged: { type: boolean }
        billingChangeReason: { type: [string, 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/SlipLine' } }
        tripIds: { type: array, items: { type: string, format: uuid } }
        signedAt: { type: [string, 'null'], format: date-time }
        hasPaperScan: { type: boolean }
        lockedByInvoice: { type: boolean }
        version: { type: integer }
    TerminalSlip:
      type: object
      description: 金額を含めない（FR-SGN-02）
      properties:
        id: { type: string, format: uuid }
        slipNo: { type: string }
        slipDate: { type: string, format: date }
        addresseeName: { type: string }
        siteName: { type: [string, 'null'] }
        lines: { type: array, items: { $ref: '#/components/schemas/SlipLine' } }
        status: { $ref: '#/components/schemas/SlipStatus' }
    BillingProblem:
      type: object
      properties:
        kind: { type: string, enum: [PRICE_MISSING, INVOICE_BLOCKED, UNSLIPPED_TRIPS, AWAITING_SIGNATURE, MAIL_TO_MISSING, ALREADY_INVOICED, INACTIVE_BILLING_PARTY, FREEE_PARTNER_UNMAPPED] }
        billingPartyId: { type: [string, 'null'], format: uuid }
        tripIds: { type: array, items: { type: string, format: uuid } }
        message: { type: string }
    BillingRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        month: { type: string }
        status: { type: string, enum: [RUNNING, DONE, FAILED] }
        createdInvoiceIds: { type: array, items: { type: string, format: uuid } }
        problems: { type: array, items: { $ref: '#/components/schemas/BillingProblem' } }
    InvoiceStatus: { type: string, enum: [DRAFT, NEEDS_RECHECK, CONFIRMED, SENDING, SENT, SEND_ERROR, VOIDED] }
    InvoiceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceNo: { type: string }
        billingPartyId: { type: string, format: uuid }
        billingPartyName: { type: string }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        siteCount: { type: integer }
        tripCount: { type: integer }
        subtotal: { type: integer }
        taxAmount: { type: integer }
        total: { type: integer }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        freeeStatus: { oneOf: [ { $ref: '#/components/schemas/FreeeRegistrationStatus' }, { type: 'null' } ] }
        version: { type: integer }
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceSummary'
        - type: object
          properties:
            lines:
              type: array
              items:
                type: object
                properties:
                  lineNo: { type: integer }
                  siteName: { type: [string, 'null'] }
                  itemName: { type: string }
                  vehicleClassName: { type: string }
                  unitPrice: { type: integer }
                  tripCount: { type: integer }
                  amount: { type: integer }
                  tripIds: { type: array, items: { type: string, format: uuid } }
                  slipIds: { type: array, items: { type: string, format: uuid } }
            replacesInvoiceId: { type: [string, 'null'], format: uuid }
            replacedByInvoiceId: { type: [string, 'null'], format: uuid }
            voidReason: { type: [string, 'null'] }
            taxRate: { type: integer }
    MailPreview:
      type: object
      properties:
        invoiceId: { type: string, format: uuid }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        body: { type: string }
        attachmentName: { type: string }
        warnings: { type: array, items: { type: string, enum: [MAIL_TO_MISSING, NOT_CONFIRMED, FREEE_PARTNER_UNMAPPED, FREEE_ITEM_UNMAPPED] } }
    MailLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [SEND, RESEND] }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        subject: { type: string }
        attachmentName: { type: string }
        status: { type: string, enum: [QUEUED, SENT, FAILED] }
        errorMessage: { type: [string, 'null'] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
    FreeeConnectionStatus:
      type: object
      properties:
        status: { type: string, enum: [DISCONNECTED, CONNECTED, COMPANY_REQUIRED, REAUTH_REQUIRED] }
        companyId: { type: [integer, 'null'] }
        companyName: { type: [string, 'null'] }
        authorizedFreeeUser: { type: [string, 'null'] }
        connectedAt: { type: [string, 'null'], format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        registrationMode: { type: string, enum: [REVIEW, AUTO] }
        lastError: { type: [string, 'null'] }
        version: { type: integer }
    FreeeRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: [string, 'null'] }
    PartnerMapping:
      type: object
      properties:
        billingPartyId: { type: string, format: uuid }
        billingPartyName: { type: string }
        freeePartnerId: { type: [integer, 'null'] }
        freeePartnerName: { type: [string, 'null'] }
        status: { type: string, enum: [UNMAPPED, AUTO, CANDIDATE, MANUAL, CREATED] }
        candidates: { type: array, items: { $ref: '#/components/schemas/FreeeRef' } }
    FreeeRegistrationStatus: { type: string, enum: [PENDING, NEEDS_ACTION, QUEUED, PROCESSING, REGISTERED, ERROR, DELETED] }
    FreeeRegistration:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        invoiceNo: { type: string }
        billingPartyName: { type: string }
        issueDate: { type: string, format: date }
        total: { type: integer }
        freeePartnerName: { type: [string, 'null'] }
        action: { type: string, enum: [CREATE, UPDATE, DELETE] }
        status: { $ref: '#/components/schemas/FreeeRegistrationStatus' }
        reasons: { type: array, items: { type: object, properties: { code: { type: string }, message: { type: string } } } }
        dealId: { type: [integer, 'null'] }
        receiptId: { type: [integer, 'null'] }
        freeeDealUrl: { type: [string, 'null'], format: uri }
        attempts: { type: integer }
        registeredAt: { type: [string, 'null'], format: date-time }
    FreeeDealPreview:
      type: object
      properties:
        deal:
          type: object
          properties:
            type: { type: string, const: income }
            issueDate: { type: string, format: date }
            dueDate: { type: string, format: date }
            partnerId: { type: [integer, 'null'] }
            partnerName: { type: [string, 'null'] }
            refNumber: { type: string }
            details: { type: array, items: { type: object, properties: { accountItemName: { type: string }, taxName: { type: string }, itemName: { type: [string, 'null'] }, amount: { type: integer }, vat: { type: integer } } } }
        receipt: { type: object, properties: { fileName: { type: string }, documentType: { type: string, const: invoice }, description: { type: string } } }
        canRegister: { type: boolean }
        reasons: { type: array, items: { type: object, properties: { code: { type: string }, message: { type: string } } } }
    FreeeApiLog:
      type: object
      properties:
        id: { type: integer }
        registrationId: { type: [string, 'null'], format: uuid }
        method: { type: string }
        path: { type: string }
        statusCode: { type: [integer, 'null'] }
        durationMs: { type: integer }
        error: { type: [string, 'null'] }
        requestedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid }
        reportLabel: { type: string }
        priceItemName: { type: string }
        direction: { type: string, enum: [RECEIVE, DELIVER] }
        sortOrder: { type: integer }
        freeeAccountItemId: { type: [integer, 'null'] }
        freeeTaxCode: { type: [integer, 'null'] }
        freeeItemId: { type: [integer, 'null'] }
        active: { type: boolean }
        version: { type: integer }
    MasterRecord:
      type: object
      description: kind ごとの項目（07 DB設計書 11章の列を camelCase にしたもの）。id・version・active は共通
      properties:
        id: { type: string, format: uuid }
        active: { type: boolean }
        version: { type: integer }
      additionalProperties: true
    PriceEntry:
      type: object
      required: [itemId, vehicleClassId, unitPrice]
      properties:
        itemId: { type: string, format: uuid }
        vehicleClassId: { type: string, format: uuid }
        unitPrice: { type: integer, minimum: 0 }
        referencePrice: { type: [integer, 'null'], readOnly: true }
        differsFromReference: { type: boolean, readOnly: true }
    PriceTable:
      type: object
      properties:
        id: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        note: { type: [string, 'null'] }
